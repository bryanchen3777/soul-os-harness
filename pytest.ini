[pytest]
# TEST-INFRA-COLLECTION-LEAK-1 (D6) — make a bare `pytest` permanently safe.
#
# Without this file, running `pytest` with no arguments at the repo root collects
# EVERY `test_*.py` reachable from the rootdir, including files that were never
# meant to be tests. `scripts/` used to hold 15 such scripts, and for three of them
# *collection alone* executed the module body: one fired six POSTs at a paid LLM
# endpoint (`HTTP 429 Token Plan usage limit`), two opened a real WebSocket to the
# already-running service. Those 15 were renamed to `manual_*.py` (D1), which makes
# them un-collectable by name; `testpaths` is the second, structural layer: even a
# stray `test_*.py` dropped anywhere outside `tests/` is out of scope for a bare run.
#
# Note this deliberately does NOT change what `pytest -q tests` collects: an
# explicit path argument overrides `testpaths`, and the node-id set is unchanged.
testpaths = tests
