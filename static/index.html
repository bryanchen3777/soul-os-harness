<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Soul OS 靈魂作業系統</title>
  <style>
    :root {
      --bg: #0f0f1a;
      --bg2: #161625;
      --bg3: #1e1e30;
      --border: #2a2a40;
      --text: #e8e8f0;
      --text2: #9090a8;
      --muted: #606078;
      --blue: #4f8cff;
      --purple: #8b6cf5;
      --yua: #a78bfa;
      --ruka: #f472b6;
      --akane: #fb923c;
      --user: #4a9eff;
      --danger: #f87171;
      --success: #4ade80;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex;
      background: var(--bg);
      color: var(--text);
      font-family: sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 200px;
      min-width: 200px;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    #sidebar-header {
      padding: 16px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text2);
      border-bottom: 1px solid var(--border);
    }
    #conversation-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .conv-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 4px;
      transition: background 0.2s;
    }
    .conv-item:hover { background: var(--bg3); }
    .conv-item.active { background: var(--bg3); }
    .conv-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      color: white;
      background: var(--blue);
      object-fit: cover;
    }
    .conv-icon.yua { background: linear-gradient(135deg, #7c6af7, #a78bfa); }
    .conv-icon.ruka { background: linear-gradient(135deg, #f97fa0, #f472b6); }
    .conv-icon.akane { background: linear-gradient(135deg, #f9a07f, #fb923c); }
    .conv-name { font-size: 13px; color: var(--text2); }
    .conv-item.active .conv-name { color: var(--text); }
    #sidebar-footer {
      padding: 12px;
      border-top: 1px solid var(--border);
    }
    #clear-memory-btn {
      width: 100%;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.2s;
      display: none;
    }
    #clear-memory-btn:hover {
      background: rgba(139, 92, 246, 0.1);
      color: var(--purple);
      border-color: var(--purple);
    }

    /* ── Main Area ── */
    #main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg2);
    }
    #chat-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }
    #group-members {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .member-btn {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 4px 12px;
      border-radius: 16px;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.2s;
    }
    .member-btn:hover { border-color: #555; color: var(--text2); }
    .member-btn.active { color: #fff; }
    .member-btn.yua.active { border-color: var(--yua); color: var(--yua); }
    .member-btn.ruka.active { border-color: var(--ruka); color: var(--ruka); }
    .member-btn.akane.active { border-color: var(--akane); color: var(--akane); }

    /* ── Chat Area ── */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .message {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      margin: 6px 0;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .message-user { flex-direction: row-reverse; }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }
    .avatar-fallback {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      color: white;
      flex-shrink: 0;
    }
    .avatar-fallback.yua    { background: linear-gradient(135deg, #7c6af7, #a78bfa); }
    .avatar-fallback.ruka   { background: linear-gradient(135deg, #f97fa0, #f472b6); }
    .avatar-fallback.akane  { background: linear-gradient(135deg, #f9a07f, #fb923c); }
    .avatar-fallback.bryan  { background: linear-gradient(135deg, #4a9eff, #2563eb); }

    .message-body {
      max-width: 70%;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .message-name {
      font-size: 11px;
      color: var(--text2);
      padding-left: 4px;
    }
    .message-bubble {
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.6;
      background: var(--bg3);
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
      transition: background 0.2s;
    }
    .message-user .message-bubble {
      background: linear-gradient(135deg, var(--user), #2563eb);
      color: white;
      border-bottom-right-radius: 6px;
    }
    .message-agent .message-bubble { border-bottom-left-radius: 6px; }

    /* Agent accent borders */
    .message-agent[data-agent="agent_yua"]   .message-bubble { border-left: 3px solid var(--yua); }
    .message-agent[data-agent="agent_ruka"]  .message-bubble { border-left: 3px solid var(--ruka); }
    .message-agent[data-agent="agent_akane"] .message-bubble { border-left: 3px solid var(--akane); }

    .message-time {
      font-size: 10px;
      color: var(--muted);
      padding: 2px 4px;
    }
    .message-user .message-time { text-align: right; }

    /* ── Status & Input ── */
    #status { font-size: 11px; color: var(--muted); padding: 6px 20px; }
    #input-bar {
      display: flex;
      gap: 12px;
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      background: var(--bg2);
    }
    #input {
      flex: 1;
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    #input:focus { border-color: var(--blue); }
    #input::placeholder { color: var(--muted); }
    #send {
      background: linear-gradient(135deg, var(--blue), #2563eb);
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: transform 0.15s;
    }
    #send:hover { transform: translateY(-1px); }
    #send:active { transform: translateY(0); }

    /* Phase 6.x STT：Soul OS 主輸入框旁的麥克風按鈕 */
    .ctrl-mic {
      background: linear-gradient(135deg, #8b6cf5, #5b54e8);  /* 紫色 */
      color: #fff;
      border: none;
      padding: 12px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 18px;
      transition: transform 0.15s, background 0.2s, box-shadow 0.2s;
      min-width: 48px;
    }
    .ctrl-mic:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4); }
    .ctrl-mic:active { transform: translateY(0); }
    .ctrl-mic.listening {
      background: linear-gradient(135deg, #f87171, #dc2626);  /* 聆聽中變紅 */
      animation: mic-pulse 1.4s ease-in-out infinite;
    }
    .ctrl-mic:disabled {
      background: #4a4a5a;
      cursor: not-allowed;
      opacity: 0.5;
    }
    @keyframes mic-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(248, 113, 113, 0.7); }
      50% { box-shadow: 0 0 0 8px rgba(248, 113, 113, 0); }
    }

    /* Phase 5+ (2026-07-15 Bry 拍板): TTS 重播按鈕
       掛在 agent 最新一則訊息旁邊,點擊重播最近一次的 TTS 音檔 */
    .replay-btn {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      font-size: 11px;
      color: var(--blue);
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(79, 140, 255, 0.1);
      transition: background 0.2s, transform 0.1s;
      user-select: none;
    }
    .replay-btn:hover {
      background: rgba(79, 140, 255, 0.2);
      transform: scale(1.05);
    }
    .replay-btn:active { transform: scale(0.95); }
    .replay-btn.playing {
      background: rgba(74, 222, 128, 0.2);
      color: var(--success);
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <div id="sidebar-header">Soul OS</div>
    <div id="conversation-list">
      <div class="conv-item active" data-conv="group" onclick="switchConversation('group')">
        <img class="conv-icon" src="/avatars/group.png" alt="群組" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 28 28%22><rect fill=%22%234f8cff%22 width=%2228%22 height=%2228%22 rx=%2214%22/><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2212%22 font-weight=%22600%22>G</text></svg>'">
        <span class="conv-name">群組聊天</span>
      </div>
      <!-- Phase 2 Dynamic UI: conv-item 列表由 initAgents() 從 GET /agents 動態生成 -->
      <!-- 載入前顯示佔位,fetch 完成後被替換 -->
      <div id="agent-conv-list"><span style="font-size:11px; color:var(--muted); padding:8px;">載入中…</span></div>
    </div>
    </div>
    <div id="sidebar-footer">
      <button id="clear-memory-btn" onclick="clearCurrentMemory()">清除記憶</button>
    </div>
  </div>

  <div id="main-area">
    <div id="chat-header">
      <span id="chat-title">群組聊天</span>
      <div id="group-members">
        <span style="font-size:11px; color:var(--muted);">成員：</span>
        <!-- Phase 2 Dynamic UI: 成員按鈕由 initAgents() 從 GET /agents 動態生成 -->
        <span id="agent-member-list"></span>
      </div>
    </div>
    <div id="chat-container"></div>
    <div id="status">連線中...</div>
    <div id="input-bar">
      <input id="input" placeholder="輸入訊息..." autofocus>
      <button id="mic" class="ctrl-mic" aria-label="語音輸入" title="點擊開始語音輸入">🎤</button>
      <button id="send">發送</button>
    </div>
  </div>

    <script>
    var currentConversation = "group";
    var currentAgent = "yua";  // Phase 6.4：當前 widget 對應角色（group=yua, private=agent_id 取代）
    // Phase 6.5：groupMembers 預設包含 Rem（讓 Rem 也能參與群聊）
    // Phase 2 Dynamic UI: 預設空 set，initAgents() 完成後從 /agents 動態注入
    var groupMembers = new Set();
    var agents = [];  // loaded by initAgents() — 動態生成的 agent 清單
    var ws = null;

    // Phase 5+ (2026-07-15 Bry 拍板): TTS 重播快取
    // key = agent_id (e.g. "agent_mahiru"), value = audio_url
    // 由兩個來源更新:
    //   1. WS agent_audio_ready 即時事件（自動播放的同一筆）
    //   2. initAgents 完成時 primeTtsCacheForAllAgents() 從 /api/tts/recent 拉
    // 重播按鈕一律用最新一筆（符合 Bry 需求:「重播最近一次」)
    var lastAudioByAgent = {};
    var currentPlayingAudio = null;  // 追蹤當前播放的 <audio>,避免重複觸發

    // ===== Phase 2 Dynamic UI: 從後端拉 agents 清單 =====
    // Cache-bust: ?_=Date.now() 防止瀏覽器用 304 + 舊 HTML
    // cache: 'no-store' 告訴 fetch 不要用 cache
    async function initAgents() {
      try {
        const url = '/agents?_=' + Date.now();
        console.log('[Soul OS] fetching agents from', url);
        const res = await fetch(url, { cache: 'no-store' });
        console.log('[Soul OS] /agents status =', res.status);

        const data = await res.json();
        console.log('[Soul OS] /agents body =', data);

        // 防呆：data.agents 不存在或不是 array 時，回空陣列（不要讓 agents = data 變 object）
        agents = Array.isArray(data && data.agents) ? data.agents : [];
        console.log('[Soul OS] agents parsed =', agents.map(a => a.id));

        renderAgentConvList();
        renderAgentMemberList();
        updateGroupMembersSet();
        // Phase 5+ (2026-07-15 Bry 拍板): agent 清單拉完,順便抓每個 agent
        // 最近一筆 TTS 音檔,讓重播按鈕一進來就能用（不用等下次說話）
        primeTtsCacheForAllAgents();
      } catch (e) {
        console.warn('[Soul OS] initAgents 失敗,使用 fallback(空清單):', e);
      }
    }

    // 載入完成後啟動
    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', initAgents);
    } else {
      initAgents();
    }

    function renderAgentConvList() {
      const container = document.getElementById('agent-conv-list');
      if (!container) return;
      // 每個 agent 一個 conv-item，用 agent_id 當 data-conv
      container.innerHTML = agents.map(a => {
        // avatar fallback SVG 用 agent_id 第一個字當首字母
        const initial = (a.name || a.id).charAt(0).toUpperCase();
        // 顏色 hash(用 agent_id 算 hex,避免所有 agent 同色)
        const hash = (a.id || '').split('').reduce((h, c) => ((h << 5) - h + c.charCodeAt(0)) | 0, 0);
        const colorHex = '#' + Math.abs(hash).toString(16).padStart(6, '0').slice(0, 6);
        return `
      <div class="conv-item" data-conv="${a.id}" onclick="switchConversation('${a.id}')">
        <img class="conv-icon" src="/avatars/${a.id.replace('agent_', '')}.png" alt="${a.name}"
             onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 28 28%22><rect fill=%22${colorHex}%22 width=%2228%22 height=%2228%22 rx=%2214%22/><text x=%5050%25%22 y=%5050%25%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2212%22 font-weight=%22600%22>${initial}</text></svg>'">
        <span class="conv-name">${a.name}</span>
      </div>`;
      }).join('');
    }

    function renderAgentMemberList() {
      const container = document.getElementById('agent-member-list');
      if (!container) return;
      // 群組成員按鈕(初始 active)
      container.innerHTML = agents.map(a => {
        const cssClass = a.id.replace('agent_', '');
        return `<button class="member-btn ${cssClass} active" data-agent="${a.id}" onclick="toggleMember(this)">${a.name}</button>`;
      }).join('');
    }

    function updateGroupMembersSet() {
      // 直接覆寫 var,免得 var 已經被引用(JS var 重新賦值安全)
      groupMembers = new Set(agents.map(a => a.id));
    }

    // ===== Phase 5+ TTS 重播 helper =====
    // 給定 agent_id 拉 /api/tts/recent,更新 lastAudioByAgent 快取
    // 若該 agent 在當前對話有訊息,把 🔊 掛到最新一則
    async function primeTtsCacheForAgent(agentId) {
      try {
        const res = await fetch(
          '/api/tts/recent?agent_id=' + encodeURIComponent(agentId) + '&limit=1',
          { cache: 'no-store' }
        );
        if (!res.ok) return;
        const data = await res.json();
        if (data && data.audios && data.audios.length > 0) {
          const audio = data.audios[0];
          lastAudioByAgent[agentId] = audio.audio_url;
          // 若該 agent 的最新訊息存在,順手把按鈕掛上
          attachReplayButtonToLatest(agentId);
        }
      } catch (e) {
        // 靜默失敗,沒有 audio 也不影響主功能
      }
    }

    async function primeTtsCacheForAllAgents() {
      // 平行 fetch,每個 agent 一次（10 個 agent 也才 10 個小 request）
      for (const a of agents) {
        primeTtsCacheForAgent(a.id);
      }
    }

    // 給 agent 最新的訊息掛上（或更新）🔊 重播按鈕
    function attachReplayButtonToLatest(agentId) {
      const all = document.querySelectorAll(
        '.message-agent[data-agent="' + agentId + '"]'
      );
      if (all.length === 0) return;
      // 先把該 agent 所有訊息的舊按鈕拔掉,避免多則都有按鈕（Bry 講「最新一則」)
      all.forEach(function (m) {
        const old = m.querySelector('.replay-btn');
        if (old) old.remove();
      });
      // 掛到最後一則
      const last = all[all.length - 1];
      const time = last.querySelector('.message-time');
      if (!time) return;
      const btn = document.createElement('span');
      btn.className = 'replay-btn';
      btn.title = '重播最近的語音';
      btn.textContent = '🔊 重播';
      btn.onclick = function (e) {
        e.stopPropagation();
        replayLastAudio(agentId, btn);
      };
      // 插在時間後面
      time.parentNode.insertBefore(btn, time.nextSibling);
    }

    function replayLastAudio(agentId, btn) {
      const url = lastAudioByAgent[agentId];
      if (!url) {
        console.warn('[TTS] no cached audio for', agentId);
        if (btn) {
          btn.textContent = '🔇 沒音檔';
          setTimeout(function () {
            if (btn.parentNode) {
              btn.textContent = '🔊 重播';
            }
          }, 1500);
        }
        return;
      }
      // 停掉前一個播放（如果還在播）
      if (currentPlayingAudio) {
        try { currentPlayingAudio.pause(); } catch (e) {}
        currentPlayingAudio = null;
        // 把舊按鈕狀態復原
        document.querySelectorAll('.replay-btn.playing').forEach(function (b) {
          b.classList.remove('playing');
          b.textContent = '🔊 重播';
        });
      }
      const audio = new Audio(url);
      audio.volume = 0.85;
      if (btn) {
        btn.classList.add('playing');
        btn.textContent = '▶ 播放中';
      }
      audio.play().then(function () {
        currentPlayingAudio = audio;
        audio.onended = function () {
          if (btn) {
            btn.classList.remove('playing');
            btn.textContent = '🔊 重播';
          }
          if (currentPlayingAudio === audio) currentPlayingAudio = null;
        };
        audio.onerror = function () {
          if (btn) {
            btn.classList.remove('playing');
            btn.textContent = '🔇 失敗';
            setTimeout(function () {
              if (btn.parentNode) btn.textContent = '🔊 重播';
            }, 1500);
          }
          currentPlayingAudio = null;
        };
      }).catch(function (err) {
        console.warn('[TTS] replay 失敗:', err && err.message);
        if (btn) {
          btn.classList.remove('playing');
          btn.textContent = '🔇 失敗';
          setTimeout(function () {
            if (btn.parentNode) btn.textContent = '🔊 重播';
          }, 1500);
        }
      });
    }

    // ===== Phase 2 Dynamic UI: titles 字典 =====
    // 由 initAgents 透過 getTitleFor 函數動態提供,不再寫死 dict
    function getTitleFor(convId) {
      if (convId === 'group') return '群組聊天';
      const a = agents.find(a => a.id === convId);
      return a ? a.name : convId;
    }

    // 載入完成後啟動
    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', initAgents);
    } else {
      initAgents();
    }

    // Live2D 已移除 — Bry 拍板砍掉 Live2D 視覺呈現（2026-07-14）
    // 介面保留純文字對話 + STT 語音輸入（瀏覽器原生 SpeechRecognition API）
    // 語音輸出走 Fish TTS → 寫 mp3 到 data/tts/{agent_id}/,Bry 自己聽

    function getStorageKey(convId) {
      return "soul_os_" + convId + "_history";
    }

    function loadHistory() {
      try {
        var saved = localStorage.getItem(getStorageKey(currentConversation));
        if (saved) JSON.parse(saved).forEach(function(msg) { appendMessage(msg, false); });
      } catch(e) {}
    }

    function saveMessage(msg) {
      try {
        var saved = localStorage.getItem(getStorageKey(currentConversation));
        var messages = saved ? JSON.parse(saved) : [];
        messages.push(msg);
        localStorage.setItem(getStorageKey(currentConversation), JSON.stringify(messages.slice(-200)));
      } catch(e) {}
    }

    function appendMessage(msg, save) {
      save = save !== false;
      var container = document.getElementById("chat-container");
      container.insertAdjacentHTML("beforeend", renderMessage(msg));
      container.scrollTop = container.scrollHeight;
      if (save) saveMessage(msg);
    }

    function clearHistory() {
      localStorage.removeItem(getStorageKey(currentConversation));
      document.getElementById("chat-container").innerHTML = "";
    }

    function switchConversation(convId) {
      document.querySelectorAll(".conv-item").forEach(function(item) {
        item.classList.remove("active");
      });
      document.querySelector(".conv-item[data-conv='" + convId + "']").classList.add("active");
      document.getElementById("chat-container").innerHTML = "";
      currentConversation = convId;
      // Phase 2 Dynamic UI: titles 用 getTitleFor() 動態查 agent 名稱（不再寫死 dict）
      document.getElementById("chat-title").textContent = getTitleFor(convId);
      var isGroup = convId === "group";
      document.getElementById("group-members").style.display = isGroup ? "flex" : "none";
      document.getElementById("clear-memory-btn").style.display = "inline-block";
      loadHistory();
      // Live2D 已移除 — 不再切換 widget
      currentAgent = convId === 'group' ? 'yua' : convId.replace('agent_', '');
    }

    function toggleMember(btn) {
      var agentId = btn.dataset.agent;
      if (groupMembers.has(agentId)) {
        groupMembers.delete(agentId);
        btn.classList.remove("active");
      } else {
        groupMembers.add(agentId);
        btn.classList.add("active");
      }
    }

    function clearCurrentMemory() {
      var agentName = currentConversation === "group" ? "群組" : currentConversation.replace("agent_", "");
      if (!confirm("確定要清除 " + agentName + " 的記憶嗎？")) return;
      var endpoint = currentConversation === "group" ? "/memory/clear/group" : "/memory/clear/" + currentConversation;
      fetch(endpoint, { method: "POST" })
        .then(function(r) { return r.json(); })
        .then(function(result) {
          console.log("Memory cleared:", result);
          localStorage.removeItem(getStorageKey(currentConversation));
          document.getElementById("chat-container").innerHTML = "";
          alert(agentName + " 的記憶已清除");
        })
        .catch(function(e) { console.error("Clear memory failed:", e); });
    }

    function escHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function getAvatarInitials(agentId) {
      var map = { "bryan": "B", "agent_yua": "Y", "agent_ruka": "R", "agent_akane": "A" };
      // Phase 6.5 — Rem 用 "レ"（日文片假名，跟 Ruka/Akane 漢字風格一致）
      // 不用 "R" 避免跟 Ruka 撞字母（雖然色票已分開）
      if (agentId === "agent_rem") return "レ";
      return map[agentId] || agentId.charAt(0).toUpperCase();
    }

    function getColorClass(agentId) {
      if (agentId === "bryan") return "bryan";
      if (agentId === "agent_yua") return "yua";
      if (agentId === "agent_ruka") return "ruka";
      if (agentId === "agent_akane") return "akane";
      // Phase 6.5 — Rem：用 "R"（雷姆英文第一個字母）作 fallback initial
      if (agentId === "agent_rem") return "rem";
      return "bryan";
    }

    function getAvatarHtml(agentId) {
      // Phase 6.5 — 加 rem.png 對應（不存在就 fallback 到 SVG with R）
      var src = { "agent_yua": "avatars/yua.png", "agent_ruka": "avatars/ruka.png", "agent_akane": "avatars/akane.png", "agent_rem": "avatars/rem.png", "bryan": "avatars/bryan.png" }[agentId];
      if (!src) {
        var name = getAvatarInitials(agentId);
        return "<div class=\"avatar-fallback " + getColorClass(agentId) + "\" data-agent=\"" + agentId + "\">" + name + "</div>";
      }
      return "<img class=\"avatar\" src=\"" + src + "\" data-agent=\"" + agentId + "\" alt=\"" + agentId + "\">";
    }

    function formatTime(timestamp) {
      var d = timestamp ? new Date(timestamp * 1000) : new Date();
      return d.toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
    }

    function renderMessage(msg) {
      var isUser = msg.speaker === "bryan";
      var agentAttr = isUser ? "" : "data-agent=\"" + msg.speaker + "\"";
      var name = isUser ? "" : "<div class=\"message-name\">" + msg.speaker.replace("agent_", "") + "</div>";
      var avatarLeft = isUser ? "" : getAvatarHtml(msg.speaker);
      var avatarRight = isUser ? getAvatarHtml("bryan") : "";
      return "<div class=\"message " + (isUser ? "message-user" : "message-agent") + "\" " + agentAttr + ">" +
             avatarLeft +
             "<div class=\"message-body\">" + name +
             "<div class=\"message-bubble\">" + escHtml(msg.content) + "</div>" +
             "<div class=\"message-time\">" + formatTime(msg.timestamp) + "</div></div>" +
             avatarRight + "</div>";
    }

    function send() {
      var text = document.getElementById("input").value.trim();
      if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
      appendMessage({ speaker: "bryan", content: text, timestamp: Math.floor(Date.now() / 1000) });
      var payload = {
        type: "USER_MESSAGE",
        content: text,
        user_id: "1696287850"
      };
      if (currentConversation === "group") {
        payload.mode = "group";
        if (groupMembers.size === 0) { alert("請至少選擇一個成員"); return; }
        payload.participants = [...groupMembers];
      } else {
        payload.mode = "private";
        payload.target_agent = currentConversation;
      }
      ws.send(JSON.stringify(payload));
      document.getElementById("input").value = "";
    }

    document.getElementById("send").addEventListener("click", send);
    document.getElementById("input").addEventListener("keydown", function(e) {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });

    // ===== Phase 6.x STT：瀏覽器原生語音辨識 → Soul OS WS =====
    // 跟 widget.html 原本的 startListening 同邏輯，但跑在主頁面（host）scope，
    // 結果直接送 Soul OS USER_MESSAGE 走真實 LLM
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    var recognition = null, listening = false;
    (function initMic() {
      var micBtn = document.getElementById("mic");
      if (!micBtn) return;
      if (!SR) {
        // 不支援的瀏覽器：disable + tooltip
        micBtn.disabled = true;
        micBtn.title = "此瀏覽器不支援語音辨識，請用 Chrome / Edge";
        console.warn("[STT] SpeechRecognition API not available");
        return;
      }
      micBtn.addEventListener("click", function() {
        if (listening && recognition) {
          recognition.stop();
          return;
        }
        try {
          recognition = new SR();
        } catch (e) {
          console.warn("[STT] failed to create recognition:", e);
          return;
        }
        recognition.lang = "zh-TW";
        recognition.interimResults = true;
        recognition.continuous = false;
        recognition.maxAlternatives = 1;
        recognition.onstart = function() {
          listening = true;
          micBtn.classList.add("listening");
          micBtn.textContent = "● 聆聽中";
        };
        recognition.onresult = function(ev) {
          var txt = "";
          for (var i = 0; i < ev.results.length; i++) txt += ev.results[i][0].transcript;
          var last = ev.results[ev.results.length - 1];
          // 顯示在輸入框（final 才送）
          document.getElementById("input").value = txt;
          if (last.isFinal && txt.trim()) {
            // 直接送 Soul OS（不等使用者按 Enter）
            send(txt.trim());
          }
        };
        recognition.onerror = function(ev) {
          listening = false;
          micBtn.classList.remove("listening");
          micBtn.textContent = "🎤";
          var msg = ev.error === "not-allowed"
            ? "需要麥克風權限才能語音輸入，請到瀏覽器設定開啟"
            : "語音辨識錯誤：" + (ev.error || "unknown");
          console.warn("[STT]", msg);
          alert(msg);
        };
        recognition.onend = function() {
          listening = false;
          micBtn.classList.remove("listening");
          micBtn.textContent = "🎤";
        };
        try {
          recognition.start();
        } catch (e) {
          console.warn("[STT] start failed:", e);
        }
      });
      console.log("[STT] mic button wired (SpeechRecognition supported)");
    })();

    // WebSocket connection
    var wsUrl = "ws://" + window.location.host + "/ws";
    console.log("[WS] Connecting to:", wsUrl);
    ws = new WebSocket(wsUrl);
    ws.onopen = function() {
      console.log("[WS] Connected!");
      document.getElementById("status").textContent = "已連線";
      document.getElementById("status").style.color = "#4ade80";
    };
    ws.onclose = function(e) {
      console.log("[WS] Closed", e);
      document.getElementById("status").textContent = "連線中斷";
      document.getElementById("status").style.color = "#f87171";
    };
    ws.onerror = function(e) {
      console.error("[WS] Error", e);
      document.getElementById("status").textContent = "連線錯誤";
      document.getElementById("status").style.color = "#f87171";
    };
    ws.onmessage = function(event) {
      try {
        var d = JSON.parse(event.data);
        // Live2D type 已移除 — 只處理 agent_speak 純文字
        if (d.type === "agent_speak" && d.text) {
          var speaker = d.agent_id || "agent_yua";
          if (currentConversation === "group") {
            if (groupMembers.size > 0 && !groupMembers.has(speaker)) return;
          } else {
            if (speaker !== currentConversation) return;
          }
          appendMessage({ speaker: speaker, content: d.text, timestamp: Math.floor(Date.now() / 1000) });
        }
        // 階段 5.5+ (B 方案 2026-07-15 Bry 拍板):
        // TTSService 寫完 mp3 → gateway broadcast agent_audio_ready
        // 前端收到自動 <audio> 播放日文語音 + 掛重播按鈕到該 agent 最新訊息
        if (d.type === "agent_audio_ready" && d.audio_url) {
          var agentId = d.agent_id;
          // 1. 更新快取（重播按鈕用）
          if (agentId) {
            lastAudioByAgent[agentId] = d.audio_url;
            // 2. 把該 agent 最新訊息掛上 🔊 按鈕
            attachReplayButtonToLatest(agentId);
          }
          // 3. 自動播放
          var audio = new Audio(d.audio_url);
          audio.volume = 0.85;
          audio.play().catch(function(err){
            // autoplay 失敗很正常 (瀏覽器政策),降為靜默失敗
            console.warn("[TTS] autoplay 失敗:", err.message);
          });
        }
      } catch(err) {
        console.error("WS message error:", err);
      }
    };

    loadHistory();
  </script>
</body>
</html>
