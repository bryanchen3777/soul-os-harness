<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Soul OS 靈魂作業系統</title>
  <style>
    :root {
      --bg: #0f0f1a;
      --bg2: #161625;
      --bg3: #1e1e30;
      --border: #2a2a40;
      --text: #e8e8f0;
      --text2: #9090a8;
      --muted: #606078;
      --blue: #4f8cff;
      --purple: #8b6cf5;
      --yua: #a78bfa;
      --ruka: #f472b6;
      --akane: #fb923c;
      --user: #4a9eff;
      --danger: #f87171;
      --success: #4ade80;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex;
      background: var(--bg);
      color: var(--text);
      font-family: sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 200px;
      min-width: 200px;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    #sidebar-header {
      padding: 16px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text2);
      border-bottom: 1px solid var(--border);
    }
    #conversation-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .conv-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 4px;
      transition: background 0.2s;
    }
    .conv-item:hover { background: var(--bg3); }
    .conv-item.active { background: var(--bg3); }
    .conv-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      color: white;
      background: var(--blue);
      object-fit: cover;
    }
    .conv-icon.yua { background: linear-gradient(135deg, #7c6af7, #a78bfa); }
    .conv-icon.ruka { background: linear-gradient(135deg, #f97fa0, #f472b6); }
    .conv-icon.akane { background: linear-gradient(135deg, #f9a07f, #fb923c); }
    .conv-name { font-size: 13px; color: var(--text2); }
    .conv-item.active .conv-name { color: var(--text); }
    #sidebar-footer {
      padding: 12px;
      border-top: 1px solid var(--border);
    }
    #clear-memory-btn {
      width: 100%;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.2s;
      display: none;
    }
    #clear-memory-btn:hover {
      background: rgba(139, 92, 246, 0.1);
      color: var(--purple);
      border-color: var(--purple);
    }

    /* ── Main Area ── */
    #main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg2);
    }
    #chat-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }
    #group-members {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .member-btn {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 4px 12px;
      border-radius: 16px;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.2s;
    }
    .member-btn:hover { border-color: #555; color: var(--text2); }
    .member-btn.active { color: #fff; }
    .member-btn.yua.active { border-color: var(--yua); color: var(--yua); }
    .member-btn.ruka.active { border-color: var(--ruka); color: var(--ruka); }
    .member-btn.akane.active { border-color: var(--akane); color: var(--akane); }

    /* ── Chat Area ── */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .message {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      margin: 6px 0;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .message-user { flex-direction: row-reverse; }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }
    .avatar-fallback {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      color: white;
      flex-shrink: 0;
    }
    .avatar-fallback.yua    { background: linear-gradient(135deg, #7c6af7, #a78bfa); }
    .avatar-fallback.ruka   { background: linear-gradient(135deg, #f97fa0, #f472b6); }
    .avatar-fallback.akane  { background: linear-gradient(135deg, #f9a07f, #fb923c); }
    .avatar-fallback.bryan  { background: linear-gradient(135deg, #4a9eff, #2563eb); }

    .message-body {
      max-width: 70%;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .message-name {
      font-size: 11px;
      color: var(--text2);
      padding-left: 4px;
    }
    .message-bubble {
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.6;
      background: var(--bg3);
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
      transition: background 0.2s;
    }
    .message-user .message-bubble {
      background: linear-gradient(135deg, var(--user), #2563eb);
      color: white;
      border-bottom-right-radius: 6px;
    }
    .message-agent .message-bubble { border-bottom-left-radius: 6px; }

    /* Agent accent borders */
    .message-agent[data-agent="agent_yua"]   .message-bubble { border-left: 3px solid var(--yua); }
    .message-agent[data-agent="agent_ruka"]  .message-bubble { border-left: 3px solid var(--ruka); }
    .message-agent[data-agent="agent_akane"] .message-bubble { border-left: 3px solid var(--akane); }

    .message-time {
      font-size: 10px;
      color: var(--muted);
      padding: 2px 4px;
    }
    .message-user .message-time { text-align: right; }

    /* ── Status & Input ── */
    #status { font-size: 11px; color: var(--muted); padding: 6px 20px; }
    #input-bar {
      display: flex;
      gap: 12px;
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      background: var(--bg2);
    }
    #input {
      flex: 1;
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    #input:focus { border-color: var(--blue); }
    #input::placeholder { color: var(--muted); }
    #send {
      background: linear-gradient(135deg, var(--blue), #2563eb);
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: transform 0.15s;
    }
    #send:hover { transform: translateY(-1px); }
    #send:active { transform: translateY(0); }
  </style>
</head>
<body>
  <div id="sidebar">
    <div id="sidebar-header">Soul OS</div>
    <div id="conversation-list">
      <div class="conv-item active" data-conv="group" onclick="switchConversation('group')">
        <img class="conv-icon" src="/avatars/group.png" alt="群組" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 28 28%22><rect fill=%22%234f8cff%22 width=%2228%22 height=%2228%22 rx=%2214%22/><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2212%22 font-weight=%22600%22>G</text></svg>'">
        <span class="conv-name">群組聊天</span>
      </div>
      <div class="conv-item" data-conv="agent_yua" onclick="switchConversation('agent_yua')">
        <img class="conv-icon" src="/avatars/yua.png" alt="Yua" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 28 28%22><rect fill=%22%237c6af7%22 width=%2228%22 height=%2228%22 rx=%2214%22/><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2212%22 font-weight=%22600%22>Y</text></svg>'">
        <span class="conv-name">Yua</span>
      </div>
      <div class="conv-item" data-conv="agent_ruka" onclick="switchConversation('agent_ruka')">
        <img class="conv-icon" src="/avatars/ruka.png" alt="瑠夏" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 28 28%22><rect fill=%22%23f97fa0%22 width=%2228%22 height=%2228%22 rx=%2214%22/><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2212%22 font-weight=%22600%22>R</text></svg>'">
        <span class="conv-name">瑠夏</span>
      </div>
      <div class="conv-item" data-conv="agent_akane" onclick="switchConversation('agent_akane')">
        <img class="conv-icon" src="/avatars/akane.png" alt="あかね" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 28 28%22><rect fill=%22%23f9a07f%22 width=%2228%22 height=%2228%22 rx=%2214%22/><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2212%22 font-weight=%22600%22>A</text></svg>'">
        <span class="conv-name">あかね</span>
      </div>
    </div>
    <div id="sidebar-footer">
      <button id="clear-memory-btn" onclick="clearCurrentMemory()">清除記憶</button>
    </div>
  </div>

  <div id="main-area">
    <div id="chat-header">
      <span id="chat-title">群組聊天</span>
      <div id="group-members">
        <span style="font-size:11px; color:var(--muted);">成員：</span>
        <button class="member-btn yua active" data-agent="agent_yua" onclick="toggleMember(this)">Yua</button>
        <button class="member-btn ruka active" data-agent="agent_ruka" onclick="toggleMember(this)">Ruka</button>
        <button class="member-btn akane active" data-agent="agent_akane" onclick="toggleMember(this)">Akane</button>
      </div>
    </div>
    <div id="chat-container"></div>
    <div id="status">連線中...</div>
    <div id="input-bar">
      <input id="input" placeholder="輸入訊息..." autofocus>
      <button id="send">發送</button>
    </div>
  </div>

    <script>
    var currentConversation = "group";
    var groupMembers = new Set(["agent_yua", "agent_ruka", "agent_akane"]);
    var ws = null;

    // ===== Phase 6.1：Live2D Widget 整合 =====
    // 載入 embed.js，window.AvatarWidget 會自動可用
    // Live2D widget 顯示在右下角浮動，現有對話體驗不破壞
    (function() {
      var s = document.createElement('script');
      // ?v=1 cache-bust（避免瀏覽器卡舊版 embed.js）
      s.src = '/static/embed.js?v=1';
      // Phase 6.1：先拿 Yua 範例模型驗證
      // Phase 6.4：會依 agent 切換模型（switch_model postMessage）
      s.setAttribute('data-model', 'https://cdn.jsdelivr.net/gh/guansss/pixi-live2d-display/test/assets/haru/haru_greeter_t03.model3.json');
      s.setAttribute('data-knowledge', '/static/knowledge.js?v=1');
      s.setAttribute('data-open', 'true');
      s.async = true;
      s.onerror = function() {
        console.warn('[Live2D] embed.js 載入失敗，繼續用純文字對話');
      };
      document.head.appendChild(s);
    })();

    // Live2D say() wrapper — emotion 預設 neutral，之後從 mood 推導
    function live2dSay(agentId, text, emotion) {
      if (!window.AvatarWidget) {
        console.debug('[Live2D] AvatarWidget not ready yet');
        return;
      }
      var em = emotion || (
        agentId === 'agent_yua' ? 'cold' :
        agentId === 'agent_ruka' ? 'happy' :
        agentId === 'agent_akane' ? 'calm' : 'neutral'
      );
      try {
        window.AvatarWidget.say(text);
        console.log('[Live2D] say:', agentId, em, text.slice(0, 30));
      } catch (e) {
        console.error('[Live2D] say error:', e);
      }
    }

    function getStorageKey(convId) {
      return "soul_os_" + convId + "_history";
    }

    function loadHistory() {
      try {
        var saved = localStorage.getItem(getStorageKey(currentConversation));
        if (saved) JSON.parse(saved).forEach(function(msg) { appendMessage(msg, false); });
      } catch(e) {}
    }

    function saveMessage(msg) {
      try {
        var saved = localStorage.getItem(getStorageKey(currentConversation));
        var messages = saved ? JSON.parse(saved) : [];
        messages.push(msg);
        localStorage.setItem(getStorageKey(currentConversation), JSON.stringify(messages.slice(-200)));
      } catch(e) {}
    }

    function appendMessage(msg, save) {
      save = save !== false;
      var container = document.getElementById("chat-container");
      container.insertAdjacentHTML("beforeend", renderMessage(msg));
      container.scrollTop = container.scrollHeight;
      if (save) saveMessage(msg);
    }

    function clearHistory() {
      localStorage.removeItem(getStorageKey(currentConversation));
      document.getElementById("chat-container").innerHTML = "";
    }

    function switchConversation(convId) {
      document.querySelectorAll(".conv-item").forEach(function(item) {
        item.classList.remove("active");
      });
      document.querySelector(".conv-item[data-conv='" + convId + "']").classList.add("active");
      document.getElementById("chat-container").innerHTML = "";
      currentConversation = convId;
      var titles = { "group": "群組聊天", "agent_yua": "Yua", "agent_ruka": "瑠夏", "agent_akane": "あかね" };
      document.getElementById("chat-title").textContent = titles[convId] || convId;
      var isGroup = convId === "group";
      document.getElementById("group-members").style.display = isGroup ? "flex" : "none";
      document.getElementById("clear-memory-btn").style.display = "inline-block";
      loadHistory();
    }

    function toggleMember(btn) {
      var agentId = btn.dataset.agent;
      if (groupMembers.has(agentId)) {
        groupMembers.delete(agentId);
        btn.classList.remove("active");
      } else {
        groupMembers.add(agentId);
        btn.classList.add("active");
      }
    }

    function clearCurrentMemory() {
      var agentName = currentConversation === "group" ? "群組" : currentConversation.replace("agent_", "");
      if (!confirm("確定要清除 " + agentName + " 的記憶嗎？")) return;
      var endpoint = currentConversation === "group" ? "/memory/clear/group" : "/memory/clear/" + currentConversation;
      fetch(endpoint, { method: "POST" })
        .then(function(r) { return r.json(); })
        .then(function(result) {
          console.log("Memory cleared:", result);
          localStorage.removeItem(getStorageKey(currentConversation));
          document.getElementById("chat-container").innerHTML = "";
          alert(agentName + " 的記憶已清除");
        })
        .catch(function(e) { console.error("Clear memory failed:", e); });
    }

    function escHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function getAvatarInitials(agentId) {
      var map = { "bryan": "B", "agent_yua": "Y", "agent_ruka": "R", "agent_akane": "A" };
      return map[agentId] || agentId.charAt(0).toUpperCase();
    }

    function getColorClass(agentId) {
      if (agentId === "bryan") return "bryan";
      if (agentId === "agent_yua") return "yua";
      if (agentId === "agent_ruka") return "ruka";
      if (agentId === "agent_akane") return "akane";
      return "bryan";
    }

    function getAvatarHtml(agentId) {
      var src = { "agent_yua": "avatars/yua.png", "agent_ruka": "avatars/ruka.png", "agent_akane": "avatars/akane.png", "bryan": "avatars/bryan.png" }[agentId];
      if (!src) {
        var name = getAvatarInitials(agentId);
        return "<div class=\"avatar-fallback " + getColorClass(agentId) + "\" data-agent=\"" + agentId + "\">" + name + "</div>";
      }
      return "<img class=\"avatar\" src=\"" + src + "\" data-agent=\"" + agentId + "\" alt=\"" + agentId + "\">";
    }

    function formatTime(timestamp) {
      var d = timestamp ? new Date(timestamp * 1000) : new Date();
      return d.toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
    }

    function renderMessage(msg) {
      var isUser = msg.speaker === "bryan";
      var agentAttr = isUser ? "" : "data-agent=\"" + msg.speaker + "\"";
      var name = isUser ? "" : "<div class=\"message-name\">" + msg.speaker.replace("agent_", "") + "</div>";
      var avatarLeft = isUser ? "" : getAvatarHtml(msg.speaker);
      var avatarRight = isUser ? getAvatarHtml("bryan") : "";
      return "<div class=\"message " + (isUser ? "message-user" : "message-agent") + "\" " + agentAttr + ">" +
             avatarLeft +
             "<div class=\"message-body\">" + name +
             "<div class=\"message-bubble\">" + escHtml(msg.content) + "</div>" +
             "<div class=\"message-time\">" + formatTime(msg.timestamp) + "</div></div>" +
             avatarRight + "</div>";
    }

    function send() {
      var text = document.getElementById("input").value.trim();
      if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
      appendMessage({ speaker: "bryan", content: text, timestamp: Math.floor(Date.now() / 1000) });
      var payload = {
        type: "USER_MESSAGE",
        content: text,
        user_id: "bryan_" + Math.random().toString(36).slice(2, 7)
      };
      if (currentConversation === "group") {
        payload.mode = "group";
        if (groupMembers.size === 0) { alert("請至少選擇一個成員"); return; }
        payload.participants = [...groupMembers];
      } else {
        payload.mode = "private";
        payload.target_agent = currentConversation;
      }
      ws.send(JSON.stringify(payload));
      document.getElementById("input").value = "";
    }

    document.getElementById("send").addEventListener("click", send);
    document.getElementById("input").addEventListener("keydown", function(e) {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });

    // WebSocket connection
    var wsUrl = "ws://" + window.location.host + "/ws";
    console.log("[WS] Connecting to:", wsUrl);
    ws = new WebSocket(wsUrl);
    ws.onopen = function() {
      console.log("[WS] Connected!");
      document.getElementById("status").textContent = "已連線";
      document.getElementById("status").style.color = "#4ade80";
    };
    ws.onclose = function(e) {
      console.log("[WS] Closed", e);
      document.getElementById("status").textContent = "連線中斷";
      document.getElementById("status").style.color = "#f87171";
    };
    ws.onerror = function(e) {
      console.error("[WS] Error", e);
      document.getElementById("status").textContent = "連線錯誤";
      document.getElementById("status").style.color = "#f87171";
    };
    ws.onmessage = function(event) {
      try {
        var d = JSON.parse(event.data);
        // Phase 6.1：Live2D 訊息 — 觸發 widget 說話
        if (d.type === "live2d" && d.text) {
          live2dSay(d.agent_id, d.text, d.emotion);
          return;
        }
        if (d.type === "agent_speak" && d.text) {
          var speaker = d.agent_id || "agent_yua";
          if (currentConversation === "group") {
            if (groupMembers.size > 0 && !groupMembers.has(speaker)) return;
          } else {
            if (speaker !== currentConversation) return;
          }
          appendMessage({ speaker: speaker, content: d.text, timestamp: Math.floor(Date.now() / 1000) });
        }
      } catch(err) {
        console.error("WS message error:", err);
      }
    };

    loadHistory();
  </script>
</body>
</html>
