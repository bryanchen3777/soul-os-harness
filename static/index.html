<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Soul OS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f0f0f; color: #eee; font-family: sans-serif;
           display: flex; flex-direction: column; height: 100vh; }

    #selector {
      display: flex; gap: 8px; padding: 14px 20px 0;
      border-bottom: 1px solid #222;
    }
    .agent-btn {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #888;
      padding: 5px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }
    .agent-btn.active {
      border-color: #2563eb;
      color: #fff;
      background: #1e3a8a;
    }
    .agent-btn:hover:not(.active) {
      border-color: #555;
      color: #ccc;
    }

    #log { flex: 1; overflow-y: auto; padding: 20px; display: flex;
           flex-direction: column; gap: 10px; }
    .msg { max-width: 70%; padding: 10px 14px; border-radius: 16px;
           line-height: 1.5; }
    .user { align-self: flex-end; background: #2563eb; color: #fff; }
    .agent { align-self: flex-start; background: #1e1e1e; color: #e0e0e0;
             border: 1px solid #333; }
    .agent-name { font-size: 11px; color: #888; margin-bottom: 4px; }
    #bar { display: flex; gap: 8px; padding: 16px;
           border-top: 1px solid #222; }
    #input { flex: 1; background: #1a1a1a; border: 1px solid #333;
             color: #eee; padding: 10px 14px; border-radius: 10px;
             font-size: 15px; outline: none; }
    #send { background: #2563eb; color: #fff; border: none;
            padding: 10px 20px; border-radius: 10px; cursor: pointer;
            font-size: 15px; }
    #status { font-size: 11px; color: #555; padding: 4px 20px; }
  </style>
</head>
<body>
  <div id="selector">
    <button class="agent-btn active" data-agent="agent_yua">Yua</button>
    <button class="agent-btn" data-agent="agent_ruka">Ruka</button>
    <button class="agent-btn" data-agent="agent_akane">Akane</button>
  </div>
  <div id="log"></div>
  <div id="status">connecting...</div>
  <div id="bar">
    <input id="input" placeholder="說點什麼..." autofocus>
    <button id="send">送出</button>
  </div>

  <script>
    let currentAgent = "agent_yua";

    document.querySelectorAll(".agent-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".agent-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentAgent = btn.dataset.agent;
      });
    });

    const log = document.getElementById('log');
    const input = document.getElementById('input');
    const status = document.getElementById('status');
    const userId = 'user_' + Math.random().toString(36).slice(2, 7);

    const ws = new WebSocket('ws://localhost:8000/ws');

    ws.onopen = () => { status.textContent = '已連線'; };
    ws.onclose = () => { status.textContent = '已斷線'; };

    ws.onmessage = (e) => {
      const data = JSON.parse(e.data);
      if (data.type === 'agent_speak' && data.text) {
        addMsg(data.agent_id || 'Yua', data.text, 'agent');
      }
    };

    function addMsg(name, text, role) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      if (role === 'agent') {
        div.innerHTML = `<div class="agent-name">${name}</div>${text}`;
      } else {
        div.textContent = text;
      }
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    function send() {
      const text = input.value.trim();
      if (!text || ws.readyState !== 1) return;
      addMsg('你', text, 'user');
      ws.send(JSON.stringify({
        type: 'USER_MESSAGE',
        content: text,
        user_id: userId,
        target_agent: currentAgent
      }));
      input.value = '';
    }

    document.getElementById('send').addEventListener('click', send);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
  </script>
</body>
</html>
