<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Soul OS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f0f0f; color: #eee; font-family: sans-serif;
           display: flex; flex-direction: column; height: 100vh; }

    /* ── 模式切換 ── */
    #top-bar {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 20px;
      border-bottom: 1px solid #222;
      flex-wrap: wrap;
    }
    .mode-toggle {
      display: flex; background: #1a1a1a;
      border: 1px solid #333; border-radius: 8px;
      overflow: hidden;
    }
    .mode-btn {
      background: none; border: none; color: #666;
      padding: 5px 14px; cursor: pointer;
      font-size: 13px; transition: all 0.2s;
    }
    .mode-btn.active { background: #2563eb; color: #fff; }
    .mode-btn:hover:not(.active) { color: #ccc; }

    /* ── 群組成員（多選）── */
    #group-members { display: flex; gap: 8px; align-items: center; }
    #group-members .label { font-size: 11px; color: #666; margin-right: 4px; }
    .member-btn {
      background: #1a1a1a; border: 1px solid #2a2a2a;
      color: #555; padding: 5px 14px;
      border-radius: 20px; cursor: pointer;
      font-size: 13px; transition: all 0.2s;
      user-select: none;
    }
    .member-btn:hover { border-color: #555; color: #ccc; }
    .member-btn.active {
      border-color: #10b981; color: #10b981; background: rgba(16,185,129,0.1);
    }
    .member-btn.yua.active   { border-color: #a78bfa; color: #a78bfa; background: rgba(167,139,250,0.1); }
    .member-btn.ruka.active  { border-color: #f472b6; color: #f472b6; background: rgba(244,114,182,0.1); }
    .member-btn.akane.active { border-color: #fb923c; color: #fb923c; background: rgba(251,146,60,0.1); }

    /* ── 私聊對象（單選）── */
    #private-agents { display: flex; gap: 8px; align-items: center; }
    #private-agents .label { font-size: 11px; color: #666; margin-right: 4px; }
    .agent-btn {
      background: #1a1a1a; border: 1px solid #2a2a2a;
      color: #555; padding: 5px 16px;
      border-radius: 20px; cursor: pointer;
      font-size: 13px; transition: all 0.2s;
    }
    .agent-btn:hover { border-color: #555; color: #ccc; }
    .agent-btn.active {
      border-color: #2563eb; color: #fff; background: #1e3a8a;
    }

    /* ── 房間指示器（區分群聊/私聊）── */
    #room-indicator {
      margin-left: auto;
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 12px;
      display: flex; align-items: center; gap: 6px;
    }
    body.group-mode #room-indicator {
      background: rgba(37,99,235,0.15);
      color: #93c5fd;
      border: 1px solid rgba(37,99,235,0.3);
    }
    body.private-mode #room-indicator {
      background: rgba(139,92,246,0.15);
      color: #c4b5fd;
      border: 1px solid rgba(139,92,246,0.3);
    }
    .room-dot { width: 6px; height: 6px; border-radius: 50%; }
    body.group-mode  .room-dot { background: #3b82f6; }
    body.private-mode .room-dot { background: #8b5cf6; }
    #back-to-group {
      background: rgba(139,92,246,0.2);
      color: #c4b5fd;
      border: 1px solid rgba(139,92,246,0.4);
      padding: 3px 10px; border-radius: 10px;
      cursor: pointer; font-size: 11px;
      display: none;
    }
    body.private-mode #back-to-group { display: inline-block; }
    #back-to-group:hover { background: rgba(139,92,246,0.3); }

    /* ── 聊天區 ── */
    #log { flex: 1; overflow-y: auto; padding: 20px; display: flex;
           flex-direction: column; gap: 10px; transition: background 0.3s; }
    body.private-mode #log {
      background: linear-gradient(180deg,
        rgba(139,92,246,0.04) 0%,
        rgba(0,0,0,0) 200px);
    }
    .msg { max-width: 70%; padding: 10px 14px; border-radius: 16px;
           line-height: 1.5; }
    .user { align-self: flex-end; background: #2563eb; color: #fff; }
    .agent { align-self: flex-start; background: #1e1e1e; color: #e0e0e0;
             border: 1px solid #333; }
    .agent-yua  { border-left: 3px solid #a78bfa; }
    .agent-ruka { border-left: 3px solid #f472b6; }
    .agent-akane{ border-left: 3px solid #fb923c; }
    .agent-name { font-size: 11px; margin-bottom: 4px; }
    .agent-yua  .agent-name { color: #a78bfa; }
    .agent-ruka .agent-name { color: #f472b6; }
    .agent-akane .agent-name { color: #fb923c; }

    /* ── 底部 ── */
    #status { font-size: 11px; color: #555; padding: 4px 20px; }
    #bar { display: flex; gap: 8px; padding: 16px; border-top: 1px solid #222; }
    #input { flex: 1; background: #1a1a1a; border: 1px solid #333;
             color: #eee; padding: 10px 14px; border-radius: 10px;
             font-size: 15px; outline: none; }
    #input:focus { border-color: #555; }
    #send { background: #2563eb; color: #fff; border: none;
            padding: 10px 20px; border-radius: 10px; cursor: pointer;
            font-size: 15px; }
    #send:hover { background: #1d4ed8; }

    /* ── 發言權 badge ── */
    .speaker-badge {
      font-size: 10px; padding: 2px 7px; border-radius: 10px;
      margin-bottom: 4px; display: inline-block;
    }
    .badge-yua   { background: #4c1d95; color: #c4b5fd; }
    .badge-ruka  { background: #4c0519; color: #f9a8d4; }
    .badge-akane { background: #431407; color: #fdba74; }
  </style>
</head>
<body>

  <div id="top-bar">
    <div class="mode-toggle">
      <button class="mode-btn active" data-mode="group">群聊</button>
      <button class="mode-btn" data-mode="private">私聊</button>
    </div>

    <!-- 群聊模式：多選群組成員（誰可以說話） -->
    <div id="group-members">
      <span class="label">成員</span>
      <button class="member-btn yua active"   data-agent="agent_yua">Yua</button>
      <button class="member-btn ruka active"  data-agent="agent_ruka">Ruka</button>
      <button class="member-btn akane active" data-agent="agent_akane">Akane</button>
    </div>

    <!-- 私聊模式：單選對話對象 -->
    <div id="private-agents" style="display:none">
      <span class="label">對象</span>
      <button class="agent-btn active" data-agent="agent_yua">Yua</button>
      <button class="agent-btn" data-agent="agent_ruka">Ruka</button>
      <button class="agent-btn" data-agent="agent_akane">Akane</button>
    </div>

    <!-- 房間指示器 -->
    <div id="room-indicator">
      <span class="room-dot"></span>
      <span id="room-label">群聊室</span>
      <button id="back-to-group">← 返回群聊</button>
    </div>
  </div>

  <div id="log"></div>
  <div id="status">connecting...</div>
  <div id="bar">
    <input id="input" placeholder="說點什麼..." autofocus>
    <button id="send">送出</button>
  </div>

  <script>
    // ── 狀態 ──
    let chatMode = 'group';          // 'group' | 'private'
    let selectedAgent = 'agent_yua';  // 私聊時的目標
    let groupMembers = new Set(['agent_yua', 'agent_ruka', 'agent_akane']);  // 群聊可說話的成員

    // ── 初始 body class（給 CSS 用）──
    document.body.classList.add('group-mode');

    // ── 模式切換 ──
    function setMode(mode) {
      chatMode = mode;
      document.querySelectorAll('.mode-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.mode === mode);
      });
      document.body.className = mode + '-mode';
      // 切換顯示對應的成員/對象選擇區
      document.getElementById('group-members').style.display = mode === 'group' ? 'flex' : 'none';
      document.getElementById('private-agents').style.display = mode === 'private' ? 'flex' : 'none';
      // 更新 room 指示
      updateRoomLabel();
    }
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => setMode(btn.dataset.mode));
    });

    // ── 返回群聊 ──
    document.getElementById('back-to-group').addEventListener('click', () => setMode('group'));

    // ── 群組成員多選 ──
    document.querySelectorAll('#group-members .member-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.agent;
        if (groupMembers.has(id)) {
          groupMembers.delete(id);
          btn.classList.remove('active');
        } else {
          groupMembers.add(id);
          btn.classList.add('active');
        }
      });
    });

    // ── 私聊對象單選 ──
    document.querySelectorAll('#private-agents .agent-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#private-agents .agent-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedAgent = btn.dataset.agent;
        updateRoomLabel();
      });
    });

    // ── 房間標籤 ──
    function updateRoomLabel() {
      const nameMap = { agent_yua: 'Yua', agent_ruka: 'Ruka', agent_akane: 'Akane' };
      const label = document.getElementById('room-label');
      if (chatMode === 'private') {
        label.textContent = `與 ${nameMap[selectedAgent]} 私聊中`;
      } else {
        const members = [...groupMembers].map(m => nameMap[m]).join('、');
        label.textContent = members
          ? `群聊室（${members}）`
          : '群聊室（無成員）';
      }
    }
    updateRoomLabel();

    // ── WebSocket ──
    const log = document.getElementById('log');
    const input = document.getElementById('input');
    const status = document.getElementById('status');
    const userId = 'user_' + Math.random().toString(36).slice(2, 7);

    const ws = new WebSocket('ws://localhost:8000/ws');
    ws.onopen  = () => { status.textContent = '已連線'; };
    ws.onclose = () => { status.textContent = '已斷線'; };

    ws.onmessage = (e) => {
      const d = JSON.parse(e.data);
      if (d.type === 'agent_speak' && d.text) {
        const agentId = d.agent_id || 'agent_yua';
        // 私聊模式：只顯示對應 agent 的訊息（避免其他 agent 漏接）
        if (chatMode === 'private' && agentId !== selectedAgent) return;
        // 群聊模式：只顯示在 members 內的訊息
        if (chatMode === 'group' && groupMembers.size > 0 && !groupMembers.has(agentId)) return;
        addMsg(agentId, d.text, 'agent');
      }
    };

    function addMsg(name, text, role) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      if (role === 'agent') {
        const cls = name.includes('yua')   ? 'agent-yua'
                  : name.includes('ruka')  ? 'agent-ruka'
                  :                          'agent-akane';
        const badgeCls = name.includes('yua')   ? 'badge-yua'
                       : name.includes('ruka')  ? 'badge-ruka'
                       :                          'badge-akane';
        const displayName = name.includes('yua')   ? 'Yua'
                          : name.includes('ruka')  ? 'Ruka'
                          :                          'Akane';
        div.className = `msg agent ${cls}`;
        div.innerHTML = `<span class="speaker-badge ${badgeCls}">${displayName}</span><div>${text}</div>`;
      } else {
        div.textContent = text;
      }
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    function send() {
      const text = input.value.trim();
      if (!text || ws.readyState !== 1) return;
      addMsg('你', text, 'user');
      const payload = {
        type: 'USER_MESSAGE',
        content: text,
        user_id: userId,
        mode: chatMode,
      };
      if (chatMode === 'private') {
        payload.target_agent = selectedAgent;
      } else {
        // 群聊：送出當前成員名單（給後端過濾）
        if (groupMembers.size === 0) {
          alert('請至少選擇一位成員');
          return;
        }
        payload.participants = [...groupMembers];
      }
      ws.send(JSON.stringify(payload));
      input.value = '';
    }

    document.getElementById('send').addEventListener('click', send);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
  </script>
</body>
</html>
