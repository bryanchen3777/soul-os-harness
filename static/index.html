<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soul OS — 靈魂之窗</title>
  <style>
    :root {
      /* 溫暖的暗色底：酒紅紫調，不是冷藍黑 */
      --bg: #171119;
      --bg2: #201724;
      --bg3: #2b1f31;
      --card: #251a2d;
      --card-hi: #302138;
      --border: #3d2b47;
      --text: #f4e9f2;
      --text2: #b8a5c0;
      --muted: #8a7594;
      /* 暖色 accent（粉 / 橘 / 紫） */
      --rose: #ff8fab;
      --rose-deep: #f5607f;
      --peach: #ffb37b;
      --lilac: #b28dff;
      --gold: #ffd27d;
      --user: #ff9d76;
      --danger: #ff7b7b;
      --success: #7edc92;
      --shadow: 0 12px 32px rgba(0, 0, 0, .38);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      overflow: hidden;
      background:
        radial-gradient(1100px 560px at 85% -10%, rgba(255, 138, 158, .13), transparent 60%),
        radial-gradient(900px 520px at 8% 112%, rgba(178, 141, 255, .11), transparent 60%),
        var(--bg);
      color: var(--text);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    }
    .hidden { display: none !important; }
    button { font-family: inherit; }

    /* ══════════════ 靈魂牆（首頁） ══════════════ */
    #view-wall {
      height: 100vh;
      overflow-y: auto;
      padding: 0 clamp(16px, 5vw, 48px) 48px;
    }
    .wall-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      padding: 40px 0 6px;
      position: sticky;
      top: 0;
      background: linear-gradient(180deg, var(--bg) 78%, rgba(23, 17, 25, 0));
      z-index: 2;
    }
    .wall-title { display: flex; align-items: center; gap: 14px; }
    .wall-logo {
      font-size: 34px;
      filter: drop-shadow(0 0 14px rgba(255, 143, 171, .55));
      animation: floaty 3.4s ease-in-out infinite;
    }
    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .wall-title h1 { font-size: 26px; letter-spacing: 1px; }
    .wall-subtitle { color: var(--text2); font-size: 13px; margin-top: 6px; }
    .soft-btn {
      background: rgba(255, 255, 255, .05);
      border: 1px solid var(--border);
      color: var(--text2);
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 12.5px;
      transition: all .2s;
    }
    .soft-btn:hover { color: var(--rose); border-color: rgba(255, 143, 171, .5); background: rgba(255, 143, 171, .08); }

    .soul-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 20px;
      padding-top: 12px;
    }
    .wall-loading, .wall-error {
      grid-column: 1 / -1;
      color: var(--text2);
      padding: 60px 0;
      text-align: center;
      font-size: 14px;
    }
    .wall-error button {
      background: transparent; border: 1px solid var(--border); color: var(--rose);
      border-radius: 999px; padding: 6px 14px; margin-left: 10px; cursor: pointer;
    }

    .soul-card {
      --acc1: var(--rose);
      --acc2: var(--peach);
      position: relative;
      overflow: hidden;
      background: linear-gradient(160deg, var(--card-hi), var(--card));
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px 18px 16px;
      cursor: pointer;
      transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
    }
    .soul-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--acc1), var(--acc2));
      opacity: .6;
    }
    .soul-card:hover {
      transform: translateY(-5px);
      border-color: var(--acc1);
      animation: breathe 2.4s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { box-shadow: var(--shadow), 0 0 0 rgba(255, 143, 171, 0); }
      50% { box-shadow: var(--shadow), 0 0 28px rgba(255, 143, 171, .22); }
    }
    .card-top { display: flex; align-items: center; gap: 12px; }
    .card-avatar {
      width: 54px; height: 54px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, .1);
      box-shadow: 0 4px 14px rgba(0, 0, 0, .35);
      flex-shrink: 0;
    }
    .card-name { font-size: 16px; font-weight: 700; }
    .mood-chip {
      display: inline-block;
      margin-top: 5px;
      font-size: 11.5px;
      color: var(--text2);
      background: rgba(255, 255, 255, .06);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 999px;
      white-space: nowrap;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .snippet {
      margin-top: 14px;
      font-size: 12.5px;
      color: var(--text2);
      line-height: 1.6;
      background: rgba(0, 0, 0, .2);
      border: 1px solid rgba(255, 255, 255, .04);
      padding: 10px 12px;
      border-radius: 12px;
      min-height: 44px;
    }
    .snip-tag { color: var(--gold); margin-right: 4px; }
    .longing-badge {
      position: absolute;
      top: 14px; right: 14px;
      background: linear-gradient(135deg, #ff5f8f, var(--rose));
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 999px;
      box-shadow: 0 4px 14px rgba(255, 95, 143, .45);
      animation: heartPulse 1.7s ease-in-out infinite;
      z-index: 1;
    }
    @keyframes heartPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.07); }
    }
    .wall-footer {
      margin-top: 40px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 1px;
    }

    /* ══════════════ 聊天視圖 ══════════════ */
    #view-chat {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #chat-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: linear-gradient(180deg, rgba(255, 143, 171, .09), transparent 130%), var(--bg2);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .hdr-btn {
      background: rgba(255, 255, 255, .05);
      border: 1px solid var(--border);
      color: var(--text2);
      border-radius: 10px;
      width: 34px; height: 34px;
      cursor: pointer;
      font-size: 15px;
      transition: all .2s;
      flex-shrink: 0;
    }
    .hdr-btn:hover { color: var(--rose); border-color: rgba(255, 143, 171, .5); }
    .hdr-title { flex: 1; min-width: 120px; }
    #chat-title { font-size: 15.5px; font-weight: 700; }
    #chat-sub { font-size: 11px; color: var(--text2); margin-top: 2px; }
    .hdr-tabs {
      display: flex;
      background: rgba(0, 0, 0, .25);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px;
    }
    .tab {
      background: transparent;
      border: none;
      color: var(--text2);
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 12.5px;
      transition: all .2s;
    }
    .tab.active {
      background: linear-gradient(135deg, rgba(255, 143, 171, .28), rgba(178, 141, 255, .22));
      color: var(--text);
      box-shadow: 0 2px 10px rgba(255, 143, 171, .18);
    }

    /* 群組/私聊切換 chip 列 */
    .member-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, .12);
      scrollbar-width: thin;
    }
    .member-btn {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text2);
      padding: 5px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 11.5px;
      white-space: nowrap;
      transition: all .2s;
      flex-shrink: 0;
    }
    .member-btn:hover { border-color: var(--rose); color: var(--text); }
    .member-btn.active {
      background: linear-gradient(135deg, rgba(255, 143, 171, .22), rgba(178, 141, 255, .18));
      color: var(--text);
      border-color: rgba(255, 143, 171, .55);
    }

    /* 聊天區 */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .message {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      animation: fadeIn .3s ease;
    }
    .message-user { flex-direction: row-reverse; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .avatar {
      width: 38px; height: 38px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, .1);
    }
    .message-body { max-width: 70%; display: flex; flex-direction: column; gap: 4px; }
    .message-name { font-size: 11px; color: var(--text2); padding-left: 4px; }
    .message-bubble {
      padding: 11px 15px;
      border-radius: 18px;
      line-height: 1.6;
      background: var(--bg3);
      border: 1px solid rgba(255, 255, 255, .04);
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .message-agent .message-bubble { border-left: 3px solid rgba(255, 143, 171, .55); border-bottom-left-radius: 6px; }
    .message-user .message-bubble {
      background: linear-gradient(135deg, var(--user), #f56b5f);
      color: #fff;
      border-bottom-right-radius: 6px;
      border-left: none;
    }
    .message-time { font-size: 10px; color: var(--muted); padding: 2px 4px; }
    .message-user .message-time { text-align: right; }

    /* 生活（diary 時間軸） */
    #life-panel {
      flex: 1;
      overflow-y: auto;
      padding: 22px 18px;
    }
    .life-loading, .life-empty { color: var(--text2); text-align: center; padding: 60px 0; font-size: 13.5px; line-height: 2; }
    .life-heading {
      font-size: 13px;
      color: var(--gold);
      letter-spacing: 1px;
      margin-bottom: 16px;
      text-align: center;
    }
    .life-entry {
      position: relative;
      background: linear-gradient(160deg, var(--card-hi), var(--card));
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 16px;
      margin-bottom: 12px;
    }
    .life-entry::before {
      content: "";
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 3px;
      border-radius: 3px 0 0 3px;
    }
    .life-entry.slot-morning::before { background: var(--gold); }
    .life-entry.slot-night::before { background: var(--lilac); }
    .life-entry.slot-dream::before { background: var(--rose); }
    .life-entry.slot-event::before { background: var(--peach); }
    .life-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .life-slot { font-size: 12px; font-weight: 700; }
    .slot-morning .life-slot { color: var(--gold); }
    .slot-night .life-slot { color: var(--lilac); }
    .slot-dream .life-slot { color: var(--rose); }
    .slot-event .life-slot { color: var(--peach); }
    .life-agent { font-size: 11px; color: var(--text2); background: rgba(255,255,255,.06); padding: 2px 8px; border-radius: 999px; }
    .life-time { margin-left: auto; font-size: 10.5px; color: var(--muted); }
    .life-content { margin-top: 8px; font-size: 13.5px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
    .life-source { margin-top: 6px; font-size: 10.5px; color: var(--muted); }

    /* 交流（角色之間的互動與對話） */
    #interactions-panel {
      flex: 1;
      overflow-y: auto;
      padding: 22px 18px;
    }
    .int-loading, .int-empty { color: var(--text2); text-align: center; padding: 60px 0; font-size: 13.5px; line-height: 2; }
    .int-heading {
      font-size: 13px;
      color: var(--gold);
      letter-spacing: 1px;
      margin-bottom: 16px;
      text-align: center;
    }
    .int-entry {
      position: relative;
      background: linear-gradient(160deg, var(--card-hi), var(--card));
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 16px;
      margin-bottom: 12px;
    }
    .int-entry::before {
      content: "";
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 3px;
      border-radius: 3px 0 0 3px;
    }
    .int-entry.type-shared_event::before { background: var(--peach); }
    .int-entry.type-cross_chat::before { background: var(--lilac); }
    .int-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .int-type { font-size: 12px; font-weight: 700; }
    .type-shared_event .int-type { color: var(--peach); }
    .type-cross_chat .int-type { color: var(--lilac); }
    .int-agent { font-size: 11px; color: var(--text2); background: rgba(255,255,255,.06); padding: 2px 8px; border-radius: 999px; }
    .int-time { margin-left: auto; font-size: 10.5px; color: var(--muted); }
    .int-content { margin-top: 8px; font-size: 13.5px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
    .int-msg {
      margin-top: 8px;
      padding: 8px 12px;
      background: rgba(0, 0, 0, .18);
      border: 1px solid rgba(255, 255, 255, .04);
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.6;
    }
    .int-msg-name { font-size: 11px; color: var(--text2); margin-right: 8px; white-space: nowrap; }
    .int-msg-text { color: var(--text); word-break: break-word; }

    /* 本質（每隻靈魂的 belief/value/trait/essence + 投影 sidecar） */
    #essence-panel {
      flex: 1;
      overflow-y: auto;
      padding: 22px 18px;
    }
    .essence-loading, .essence-empty { color: var(--text2); text-align: center; padding: 60px 0; font-size: 13.5px; line-height: 2; }
    .essence-heading {
      font-size: 13px;
      color: var(--gold);
      letter-spacing: 1px;
      margin-bottom: 16px;
      text-align: center;
    }
    .essence-soul {
      position: relative;
      background: linear-gradient(160deg, var(--card-hi), var(--card));
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 14px;
    }
    .essence-soul::before {
      content: "";
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 3px;
      border-radius: 3px 0 0 3px;
      background: var(--lilac);
    }
    .essence-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .essence-avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, .12);
    }
    .essence-name { font-size: 15px; font-weight: 700; }
    .essence-id { margin-left: auto; font-size: 10.5px; color: var(--muted); }
    .essence-count { font-size: 10.5px; color: var(--text2); background: rgba(255,255,255,.06); padding: 2px 8px; border-radius: 999px; }
    .essence-group { margin-bottom: 10px; }
    .essence-type {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 5px;
      padding: 2px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .06);
      color: var(--text2);
    }
    .essence-type.type-belief { color: var(--peach); border: 1px solid rgba(255, 179, 123, .3); }
    .essence-type.type-value { color: var(--gold); border: 1px solid rgba(255, 210, 125, .3); }
    .essence-type.type-trait { color: var(--rose); border: 1px solid rgba(255, 143, 171, .3); }
    .essence-type.type-essence { color: var(--lilac); border: 1px solid rgba(178, 141, 255, .3); }
    .essence-item {
      position: relative;
      padding: 7px 10px 7px 14px;
      margin: 4px 0;
      background: rgba(0, 0, 0, .18);
      border: 1px solid rgba(255, 255, 255, .04);
      border-radius: 10px;
      font-size: 12.5px;
      line-height: 1.6;
      color: var(--text);
      word-break: break-word;
    }
    .essence-item::before {
      content: "◆";
      position: absolute;
      left: 4px; top: 8px;
      font-size: 9px;
      color: var(--muted);
    }
    .essence-node-id { display: block; font-size: 10px; color: var(--muted); margin-top: 3px; font-family: ui-monospace, Consolas, monospace; }
    .essence-projection {
      margin-top: 10px;
      padding: 8px 12px;
      background: rgba(178, 141, 255, .08);
      border: 1px solid rgba(178, 141, 255, .2);
      border-radius: 12px;
      font-size: 11.5px;
      color: var(--text2);
      line-height: 1.7;
    }
    .essence-projection .proj-label { color: var(--lilac); font-weight: 700; margin-right: 6px; }
    .essence-projection .proj-ids { font-family: ui-monospace, Consolas, monospace; font-size: 10.5px; color: var(--text); word-break: break-all; }
    .essence-projection .proj-none { color: var(--muted); }

    /* 狀態 + 輸入列 */
    #status { font-size: 11px; color: var(--muted); padding: 6px 18px; }
    #input-bar {
      display: flex;
      gap: 10px;
      padding: 14px 16px;
      border-top: 1px solid var(--border);
      background: var(--bg2);
    }
    #input {
      flex: 1;
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 14px;
      outline: none;
      transition: border-color .2s;
    }
    #input:focus { border-color: rgba(255, 143, 171, .7); box-shadow: 0 0 0 3px rgba(255, 143, 171, .08); }
    #input::placeholder { color: var(--muted); }
    #send {
      background: linear-gradient(135deg, var(--rose), var(--rose-deep));
      color: #fff;
      border: none;
      padding: 12px 22px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: transform .15s, box-shadow .2s;
      flex-shrink: 0;
    }
    #send:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(255, 96, 127, .35); }
    #send:active { transform: translateY(0); }

    .ctrl-mic {
      background: linear-gradient(135deg, var(--lilac), #8a5cf5);
      color: #fff;
      border: none;
      padding: 12px 16px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 18px;
      transition: transform .15s, background .2s, box-shadow .2s;
      min-width: 48px;
      flex-shrink: 0;
    }
    .ctrl-mic:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(178, 141, 255, .4); }
    .ctrl-mic:active { transform: translateY(0); }
    .ctrl-mic.listening {
      background: linear-gradient(135deg, var(--danger), #d94a4a);
      animation: mic-pulse 1.4s ease-in-out infinite;
    }
    .ctrl-mic:disabled { background: #4a3a4a; cursor: not-allowed; opacity: .5; }
    @keyframes mic-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 123, 123, .7); }
      50% { box-shadow: 0 0 0 8px rgba(255, 123, 123, 0); }
    }

    /* TTS 重播按鈕 */
    .replay-btn {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      font-size: 11px;
      color: var(--peach);
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(255, 179, 123, .1);
      transition: background .2s, transform .1s;
      user-select: none;
      margin-left: 6px;
    }
    .replay-btn:hover { background: rgba(255, 179, 123, .22); transform: scale(1.05); }
    .replay-btn:active { transform: scale(0.95); }
    .replay-btn.playing { background: rgba(126, 220, 146, .2); color: var(--success); }
  </style>
</head>
<body>

  <!-- ══ 靈魂牆（首頁） ══ -->
  <div id="view-wall">
    <header class="wall-header">
      <div class="wall-title">
        <span class="wall-logo">✦</span>
        <div>
          <h1>Soul OS · 靈魂之窗</h1>
          <p class="wall-subtitle">十個女孩正過著自己的生活。點進一張卡片，走進她的日子。</p>
        </div>
      </div>
      <button id="wall-refresh" class="soft-btn" onclick="loadSoulStatus()">⟳ 更新</button>
    </header>
    <main id="soul-grid" class="soul-grid"></main>
    <footer class="wall-footer">Soul OS — 每個女孩都有自己的呼吸，也會想念你。</footer>
  </div>

  <!-- ══ 聊天視圖 ══ -->
  <div id="view-chat" class="hidden">
    <header id="chat-header">
      <button id="back-btn" class="hdr-btn" title="回到靈魂牆" onclick="backToWall()">←</button>
      <div class="hdr-title">
        <div id="chat-title">群組聊天</div>
        <div id="chat-sub"></div>
      </div>
      <div class="hdr-tabs">
        <button id="tab-chat" class="tab active" onclick="switchTab('chat')">💬 聊天</button>
        <button id="tab-life" class="tab" onclick="switchTab('life')">📖 生活</button>
        <button id="tab-interact" class="tab" onclick="switchTab('interact')">🤝 交流</button>
        <button id="tab-essence" class="tab" onclick="switchTab('essence')">🧬 本質</button>
      </div>
      <button id="clear-memory-btn" class="hdr-btn" title="清除記憶" onclick="clearCurrentMemory()">🗑</button>
    </header>
    <nav id="group-members" class="member-row"></nav>
    <div id="chat-container"></div>
    <div id="life-panel" class="hidden"></div>
    <div id="interactions-panel" class="hidden"></div>
    <div id="essence-panel" class="hidden"></div>
    <div id="status">連線中…</div>
    <div id="input-bar">
      <input id="input" placeholder="輸入訊息…" autofocus>
      <button id="mic" class="ctrl-mic" aria-label="語音輸入" title="點擊開始語音輸入">🎤</button>
      <button id="send">發送</button>
    </div>
  </div>

  <script>
    // ════════════════════════════════════════════
    // 全域狀態
    // ════════════════════════════════════════════
    var currentConversation = "group";   // "group" 或完整 agent_id（如 "agent_ruka"）
    var groupMembers = new Set();        // 群聊參與者（預設全員）
    var agents = [];                     // 從 GET /agents 拉的 metadata
    var agentsById = {};                 // id → {id, name, ...}（真名 map，修 bug 用）
    var soulStatusMap = {};              // id → {mood_emoji, mood_text, ...}
    var inChatView = false;              // 目前在聊天視圖嗎（靈魂牆時不渲染訊息）
    var ws = null;

    // TTS 重播快取（沿用 Phase 5 / M6.2-1 邏輯）
    var lastAudioByAgent = {};
    var lastAudioByMessageId = {};
    var currentPlayingAudio = null;

    // ════════════════════════════════════════════
    // 工具
    // ════════════════════════════════════════════
    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    // 真名 map（Bug fix：不要再顯示 ruka 這種 id 尾巴）
    function displayName(id) {
      var a = agentsById[id];
      return a ? a.name : String(id || "").replace("agent_", "");
    }
    function shortId(id) { return String(id || "").replace("agent_", ""); }

    // 角色色票（暖調）：id hash → [亮色, 深色]
    function avatarColor(id) {
      if (id === "bryan") return ["#4a9eff", "#2563eb"];
      if (id === "group") return ["#ff8fab", "#f5607f"];
      var hash = (id || "").split("").reduce(function (h, c) { return ((h << 5) - h + c.charCodeAt(0)) | 0; }, 0);
      var palettes = [
        ["#ff8ba7", "#ff5f8f"], ["#ffb37d", "#ff8a5c"], ["#b28dff", "#8a5cf5"],
        ["#ffd27d", "#ffa94d"], ["#7dd8c9", "#4db8a8"], ["#f78fb3", "#e0557e"],
        ["#a8d8ff", "#6fa9ff"], ["#c9a7ff", "#9a6fff"], ["#ff9d8f", "#f56b5f"]
      ];
      return palettes[Math.abs(hash) % palettes.length];
    }
    function avatarFallbackSrc(id, name) {
      var c = avatarColor(id);
      var initial = (name || id || "?").charAt(0).toUpperCase();
      var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">' +
        '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0%" stop-color="' + c[0] + '"/><stop offset="100%" stop-color="' + c[1] + '"/>' +
        '</linearGradient></defs>' +
        '<rect width="80" height="80" rx="40" fill="url(#g)"/>' +
        '<text x="50%" y="50%" dy="0.35em" text-anchor="middle" fill="#fff" font-size="34" font-weight="600" font-family="sans-serif">' + esc(initial) + '</text></svg>';
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    }
    // 統一的頭像 img：PNG 存在就用，不存在 fallback 到 SVG 色塊
    function avatarImg(cls, id, name) {
      var fb = avatarFallbackSrc(id, name || id);
      return '<img class="' + cls + '" src="/avatars/' + shortId(id) + '.png" alt="' + esc(name || id) + '" loading="lazy" ' +
        'onerror="this.onerror=null;this.src=this.dataset.fb" data-fb="' + esc(fb) + '">';
    }
    function formatTime(timestamp) {
      var d = timestamp ? new Date(timestamp * 1000) : new Date();
      return d.toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
    }
    function fmtDiaryTime(ts) {
      var d = new Date(ts);
      if (isNaN(d.getTime())) return "";
      return d.toLocaleString("zh-TW", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false });
    }
    function slotLabel(slot) {
      var m = { morning: ["🌅", "早上"], night: ["🌙", "晚上"], dream: ["💭", "夢"], event: ["✨", "活動"] };
      var v = m[slot];
      return v || [slot, slot];
    }

    // ════════════════════════════════════════════
    // 靈魂牆
    // ════════════════════════════════════════════
    async function loadSoulStatus() {
      var grid = document.getElementById("soul-grid");
      grid.innerHTML = '<div class="wall-loading">讓靈魂們醒過來…</div>';
      try {
        var res = await fetch("/api/soul/status?_=" + Date.now(), { cache: "no-store" });
        var data = await res.json();
        var list = Array.isArray(data && data.agents) ? data.agents : [];
        soulStatusMap = {};
        list.forEach(function (a) { soulStatusMap[a.id] = a; });
        renderSoulWall(list);
      } catch (e) {
        console.warn("[Soul] loadSoulStatus 失敗:", e);
        grid.innerHTML = '<div class="wall-error">靈魂們還沒有回應⋯⋯<button onclick="loadSoulStatus()">再試一次</button></div>';
      }
    }

    function renderSoulWall(list) {
      var grid = document.getElementById("soul-grid");
      var cards = wallCard({ id: "group", name: "群組聊天", group: true });
      list.forEach(function (a) { cards += wallCard(a); });
      grid.innerHTML = cards;
    }

    function wallCard(a) {
      if (a.group) {
        return '<div class="soul-card" style="--acc1:#ff8fab;--acc2:#ffb37b" onclick="openChat(\'group\')">' +
          '<div class="card-top">' + avatarImg("card-avatar", "group", "群組") +
          '<div><div class="card-name">群組聊天</div><div class="mood-chip">👥 全部一起</div></div></div>' +
          '<div class="snippet"><span class="snip-tag">💬</span> 跟所有女孩在同一個空間裡說話。</div></div>';
      }
      var c = avatarColor(a.id);
      var badge = (a.longing >= 0.3) ? '<span class="longing-badge">💗 想見你</span>' : "";
      var act;
      if (a.recent_activity) act = '<span class="snip-tag">✨ 活動</span>' + esc(a.recent_activity);
      else if (a.recent_dream) act = '<span class="snip-tag">💭 夢</span>' + esc(a.recent_dream);
      else act = '<span class="snip-tag">🌙</span> 靜靜地過著自己的日子…';
      return '<div class="soul-card" style="--acc1:' + c[0] + ';--acc2:' + c[1] + '" onclick="openChat(\'' + a.id + '\')">' + badge +
        '<div class="card-top">' + avatarImg("card-avatar", a.id, a.name) +
        '<div><div class="card-name">' + esc(a.name) + '</div>' +
        '<div class="mood-chip">' + esc(a.mood_emoji || "") + " " + esc(a.mood_text || "平靜") + '</div></div></div>' +
        '<div class="snippet">' + act + '</div></div>';
    }

    // ════════════════════════════════════════════
    // 視圖切換（靈魂牆 ⇄ 聊天）
    // ════════════════════════════════════════════
    function switchView(v) {
      inChatView = (v === "chat");
      document.getElementById("view-wall").classList.toggle("hidden", inChatView);
      document.getElementById("view-chat").classList.toggle("hidden", !inChatView);
    }

    function openChat(convId) {
      switchView("chat");
      switchConversation(convId);
    }

    function backToWall() {
      switchView("wall");
      loadSoulStatus();  // 回到牆上時靜默刷新狀態
    }

    // ════════════════════════════════════════════
    // initAgents：從 /agents 拉真名 map + 渲染成員列
    // ════════════════════════════════════════════
    async function initAgents() {
      try {
        var res = await fetch("/agents?_=" + Date.now(), { cache: "no-store" });
        var data = await res.json();
        agents = Array.isArray(data && data.agents) ? data.agents : [];
        agentsById = {};
        agents.forEach(function (a) { agentsById[a.id] = a; });
        groupMembers = new Set(agents.map(function (a) { return a.id; }));
        renderMemberRow();
        primeTtsCacheForAllAgents();
      } catch (e) {
        console.warn("[Soul] initAgents 失敗:", e);
      }
    }

    // 群組/私聊切換：chip 列，點「👥 群聊」= 群組，點角色 = 私聊
    function renderMemberRow() {
      var c = document.getElementById("group-members");
      if (!c) return;
      var html = '<button class="member-btn ' + (currentConversation === "group" ? "active" : "") +
        '" onclick="switchConversation(\'group\')">👥 群聊</button>';
      agents.forEach(function (a) {
        html += '<button class="member-btn ' + (currentConversation === a.id ? "active" : "") +
          '" onclick="switchConversation(\'' + a.id + '\')">' + esc(a.name) + '</button>';
      });
      c.innerHTML = html;
    }

    function switchConversation(convId) {
      currentConversation = convId;
      renderMemberRow();
      var isGroup = convId === "group";
      document.getElementById("chat-container").innerHTML = "";
      document.getElementById("life-panel").innerHTML = "";
      document.getElementById("chat-title").textContent = isGroup ? "群組聊天" : displayName(convId);
      var sub;
      if (isGroup) {
        sub = agents.length + " 位成員在線 · 所有人一起聊";
      } else {
        var st = soulStatusMap[convId];
        sub = "私聊 · " + (st ? (st.mood_emoji + " " + st.mood_text) : "靜靜地");
      }
      document.getElementById("chat-sub").textContent = sub;
      switchTab("chat");  // 切換對話一律回到聊天分頁
      loadHistory();
      if (isGroup) primeTtsCacheForAllAgents();
      else primeTtsCacheForAgent(convId);
    }

    // ════════════════════════════════════════════
    // 聊天 / 生活 分頁
    // ════════════════════════════════════════════
    function switchTab(tab) {
      var isChat = (tab === "chat");
      var isLife = (tab === "life");
      var isInteract = (tab === "interact");
      var isEssence = (tab === "essence");
      document.getElementById("tab-chat").classList.toggle("active", isChat);
      document.getElementById("tab-life").classList.toggle("active", isLife);
      document.getElementById("tab-interact").classList.toggle("active", isInteract);
      document.getElementById("tab-essence").classList.toggle("active", isEssence);
      document.getElementById("chat-container").classList.toggle("hidden", !isChat);
      document.getElementById("life-panel").classList.toggle("hidden", !isLife);
      document.getElementById("interactions-panel").classList.toggle("hidden", !isInteract);
      document.getElementById("essence-panel").classList.toggle("hidden", !isEssence);
      document.getElementById("input-bar").classList.toggle("hidden", !isChat);
      document.getElementById("status").classList.toggle("hidden", !isChat);
      if (isLife) loadLifeTimeline();
      if (isInteract) loadInteractions();
      if (isEssence) loadEssence();
    }

    // 生活時間軸：私聊 = 該角色；群聊 = 全員合併
    function loadLifeTimeline() {
      var panel = document.getElementById("life-panel");
      if (!panel) return;
      panel.innerHTML = '<div class="life-loading">翻開日記…</div>';
      var ids = (currentConversation === "group")
        ? agents.map(function (a) { return a.id; })
        : [currentConversation];
      Promise.all(ids.map(function (id) {
        return fetch("/api/soul/diary/" + encodeURIComponent(id), { cache: "no-store" })
          .then(function (r) { return r.json(); })
          .catch(function () { return { agent_id: id, entries: [] }; });
      })).then(function (results) {
        var all = [];
        results.forEach(function (res) {
          (res.entries || []).forEach(function (e) { e.agent_id = res.agent_id; all.push(e); });
        });
        all.sort(function (a, b) { return (a.ts || "").localeCompare(b.ts || ""); });
        renderLife(panel, all);
      });
    }

    function renderLife(panel, all) {
      if (!all.length) {
        panel.innerHTML = '<div class="life-empty">她還沒有寫下任何日記。<br>多來跟她說說話，她的世界會慢慢長出來。</div>';
        return;
      }
      var html = '<div class="life-heading">' +
        (currentConversation === "group" ? "大家的近況 · 最近一週" : displayName(currentConversation) + " 的最近一週") +
        '</div>';
      all.forEach(function (e) {
        var sl = slotLabel(e.slot);
        var nameTag = (currentConversation === "group")
          ? '<span class="life-agent">' + esc(displayName(e.agent_id)) + '</span>' : "";
        var src = (e.source === "llm") ? "她自己寫的" : (e.source === "placeholder" ? "樸素的一筆" : esc(e.source || ""));
        html += '<div class="life-entry slot-' + esc(e.slot) + '">' +
          '<div class="life-head"><span class="life-slot">' + sl[0] + " " + sl[1] + '</span>' + nameTag +
          '<span class="life-time">' + esc(fmtDiaryTime(e.ts)) + '</span></div>' +
          '<div class="life-content">' + esc(e.content || "") + '</div>' +
          '<div class="life-source">' + src + '</div></div>';
      });
      panel.innerHTML = html;
    }

    // ════════════════════════════════════════════
    // 交流（角色之間的互動與對話，2026-08-22）
    // ════════════════════════════════════════════
    async function loadInteractions() {
      var panel = document.getElementById("interactions-panel");
      if (!panel) return;
      panel.innerHTML = '<div class="int-loading">翻翻大家的交流…</div>';
      try {
        var res = await fetch("/api/soul/interactions?_=" + Date.now(), { cache: "no-store" });
        var data = await res.json();
        renderInteractions(panel, Array.isArray(data && data.interactions) ? data.interactions : []);
      } catch (e) {
        console.warn("[Soul] loadInteractions 失敗:", e);
        panel.innerHTML = '<div class="int-empty">交流記錄讀取失敗。</div>';
      }
    }

    function renderInteractions(panel, list) {
      if (!list.length) {
        panel.innerHTML = '<div class="int-empty">還沒有交流記錄。<br>角色們正在各自過日子，也許待會就會碰在一起。</div>';
        return;
      }
      var html = '<div class="int-heading">角色們的交流 · 最近 ' + list.length + ' 筆</div>';
      list.forEach(function (r) {
        if (r.type === "shared_event") {
          var names = (r.agents || []).map(displayName).join(" 與 ");
          var content = r.content || (r.activity ? "今天一起做了 " + r.activity : "");
          html += '<div class="int-entry type-shared_event">' +
            '<div class="int-head"><span class="int-type">🤝 一起</span>' +
            '<span class="int-agent">' + esc(names) + '</span>' +
            '<span class="int-time">' + esc(fmtDiaryTime(r.ts)) + '</span></div>' +
            '<div class="int-content">' + esc(content) + '</div></div>';
        } else if (r.type === "cross_chat") {
          var names2 = (r.agents || []).map(displayName).join(" 與 ");
          var msgsHtml = (r.messages || []).map(function (m) {
            return '<div class="int-msg"><span class="int-msg-name">' + esc(displayName(m.agent)) + '</span>' +
              '<span class="int-msg-text">' + esc(m.content) + '</span></div>';
          }).join("");
          html += '<div class="int-entry type-cross_chat">' +
            '<div class="int-head"><span class="int-type">💬 聊天</span>' +
            '<span class="int-agent">' + esc(names2) + '</span>' +
            '<span class="int-time">' + esc(fmtDiaryTime(r.ts)) + '</span></div>' + msgsHtml + '</div>';
        }
      });
      panel.innerHTML = html;
    }

    // ════════════════════════════════════════════
    // 本質（靈魂的 belief/value/trait/essence + 投影 sidecar）
    // ════════════════════════════════════════════
    var ESSENCE_TYPE_LABELS = {
      belief: "信念",
      value: "价值",
      trait: "性格",
      essence: "内涵"
    };
    var ESSENCE_TYPE_ORDER = ["belief", "value", "trait", "essence"];

    // 本質時間軸：私聊 = 該角色；群聊 = 全員合併
    function loadEssence() {
      var panel = document.getElementById("essence-panel");
      if (!panel) return;
      panel.innerHTML = '<div class="essence-loading">凝視她的本質…</div>';
      var ids = (currentConversation === "group")
        ? agents.map(function (a) { return a.id; })
        : [currentConversation];
      Promise.all(ids.map(function (id) {
        return fetch("/api/soul/essence/" + encodeURIComponent(id), { cache: "no-store" })
          .then(function (r) { return r.json(); })
          .catch(function () { return { agent_id: id, essence: {}, projection: null }; });
      })).then(function (results) {
        renderEssence(panel, results);
      });
    }

    function renderEssence(panel, results) {
      var total = results.reduce(function (acc, r) {
        return acc + ESSENCE_TYPE_ORDER.reduce(function (n, t) {
          return n + ((r.essence && r.essence[t]) ? r.essence[t].length : 0);
        }, 0);
      }, 0);
      if (!total) {
        panel.innerHTML = '<div class="essence-empty">還沒有人長出本質。<br>信念、价值、性格、内涵會在相處中慢慢沉澱下來。</div>';
        return;
      }
      var html = '<div class="essence-heading">' +
        (currentConversation === "group" ? "大家的靈魂本質" : displayName(currentConversation) + " 的靈魂本質") +
        '</div>';
      results.forEach(function (r) {
        var essence = r.essence || {};
        var soulCount = ESSENCE_TYPE_ORDER.reduce(function (n, t) { return n + ((essence[t] || []).length); }, 0);
        if (soulCount === 0) return; // 該靈魂還沒有本質節點，跳過
        var groupsHtml = "";
        ESSENCE_TYPE_ORDER.forEach(function (t) {
          var items = essence[t] || [];
          if (!items.length) return;
          groupsHtml += '<div class="essence-group"><span class="essence-type type-' + t + '">' +
            (ESSENCE_TYPE_LABELS[t] || t) + ' · ' + items.length + '</span>' +
            items.map(function (n) {
              return '<div class="essence-item">' + esc(n.content) +
                '<span class="essence-node-id">' + esc(n.node_id) + '</span></div>';
            }).join("") + '</div>';
        });
        var projHtml = "";
        if (r.projection) {
          var ids = (r.projection.projected_node_ids || []).join(", ") ||
            (r.projection.node_count ? r.projection.node_count + " 節點" : "");
          projHtml = '<div class="essence-projection"><span class="proj-label">🔭 最近投影</span>' +
            (ids ? '<span class="proj-ids">' + esc(ids) + '</span>'
                 : '<span class="proj-none">無投影記錄</span>') +
            (r.projection.ts ? '<div style="margin-top:3px;color:var(--muted)">' + esc(fmtDiaryTime(r.projection.ts)) + '</div>' : "") +
            '</div>';
        } else {
          projHtml = '<div class="essence-projection"><span class="proj-label">🔭 最近投影</span>' +
            '<span class="proj-none">尚未投影</span></div>';
        }
        html += '<div class="essence-soul"><div class="essence-head">' +
          avatarImg("essence-avatar", r.agent_id, displayName(r.agent_id)) +
          '<div><div class="essence-name">' + esc(displayName(r.agent_id)) + '</div>' +
          '<span class="essence-count">' + soulCount + ' 個本質節點</span></div>' +
          '<span class="essence-id">' + esc(r.agent_id) + '</span></div>' +
          groupsHtml + projHtml + '</div>';
      });
      panel.innerHTML = html;
    }

    // ════════════════════════════════════════════
    // localStorage 歷史
    // ════════════════════════════════════════════
    function getStorageKey(convId) {
      return "soul_os_" + convId + "_history";
    }
    function loadHistory() {
      try {
        var saved = localStorage.getItem(getStorageKey(currentConversation));
        if (saved) JSON.parse(saved).forEach(function (msg) { appendMessage(msg, false); });
      } catch (e) {}
    }
    function saveMessage(msg) {
      try {
        var saved = localStorage.getItem(getStorageKey(currentConversation));
        var messages = saved ? JSON.parse(saved) : [];
        messages.push(msg);
        localStorage.setItem(getStorageKey(currentConversation), JSON.stringify(messages.slice(-200)));
      } catch (e) {}
    }
    function appendMessage(msg, save) {
      save = save !== false;
      var container = document.getElementById("chat-container");
      container.insertAdjacentHTML("beforeend", renderMessage(msg));
      container.scrollTop = container.scrollHeight;
      if (save) saveMessage(msg);
    }
    function clearHistory() {
      localStorage.removeItem(getStorageKey(currentConversation));
      document.getElementById("chat-container").innerHTML = "";
    }

    function clearCurrentMemory() {
      var name = currentConversation === "group" ? "群組" : displayName(currentConversation);
      if (!confirm("確定要清除 " + name + " 的記憶嗎？")) return;
      var endpoint = currentConversation === "group" ? "/memory/clear/group" : "/memory/clear/" + currentConversation;
      fetch(endpoint, { method: "POST" })
        .then(function (r) { return r.json(); })
        .then(function (result) {
          console.log("Memory cleared:", result);
          localStorage.removeItem(getStorageKey(currentConversation));
          document.getElementById("chat-container").innerHTML = "";
          alert(name + " 的記憶已清除");
        })
        .catch(function (e) { console.error("Clear memory failed:", e); });
    }

    // ════════════════════════════════════════════
    // 訊息渲染（Bug fix：顯示真名，不顯示 ruka 這種 id 尾巴）
    // ════════════════════════════════════════════
    function renderMessage(msg) {
      var isUser = msg.speaker === "bryan";
      var agentAttr = isUser ? "" : "data-agent=\"" + esc(msg.speaker) + "\"";
      var msgIdAttr = msg.message_id ? " data-message-id=\"" + esc(msg.message_id) + "\"" : "";
      var name = isUser ? "" : "<div class=\"message-name\">" + esc(displayName(msg.speaker)) + "</div>";
      var avatarLeft = isUser ? "" : avatarImg("avatar", msg.speaker, displayName(msg.speaker));
      var avatarRight = isUser ? avatarImg("avatar", "bryan", "你") : "";
      return "<div class=\"message " + (isUser ? "message-user" : "message-agent") + "\" " + agentAttr + msgIdAttr + ">" +
        avatarLeft +
        "<div class=\"message-body\">" + name +
        "<div class=\"message-bubble\">" + esc(msg.content) + "</div>" +
        "<div class=\"message-time\">" + formatTime(msg.timestamp) + "</div></div>" +
        avatarRight + "</div>";
    }

    function send() {
      var text = document.getElementById("input").value.trim();
      if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
      appendMessage({ speaker: "bryan", content: text, timestamp: Math.floor(Date.now() / 1000) });
      var payload = { type: "USER_MESSAGE", content: text, user_id: "1696287850" };
      if (currentConversation === "group") {
        payload.mode = "group";
        payload.participants = groupMembers.size ? Array.from(groupMembers) : agents.map(function (a) { return a.id; });
      } else {
        payload.mode = "private";
        payload.target_agent = currentConversation;
      }
      ws.send(JSON.stringify(payload));
      document.getElementById("input").value = "";
    }
    document.getElementById("send").addEventListener("click", send);
    document.getElementById("input").addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });

    // ════════════════════════════════════════════
    // STT（瀏覽器原生語音辨識）
    // ════════════════════════════════════════════
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    var recognition = null, listening = false;
    function initMic() {
      var micBtn = document.getElementById("mic");
      if (!micBtn) return;
      if (!SR) {
        micBtn.disabled = true;
        micBtn.title = "此瀏覽器不支援語音辨識，請用 Chrome / Edge";
        console.warn("[STT] SpeechRecognition API not available");
        return;
      }
      micBtn.addEventListener("click", function () {
        if (listening && recognition) { recognition.stop(); return; }
        try { recognition = new SR(); } catch (e) {
          console.warn("[STT] failed to create recognition:", e); return;
        }
        recognition.lang = "zh-TW";
        recognition.interimResults = true;
        recognition.continuous = false;
        recognition.maxAlternatives = 1;
        recognition.onstart = function () {
          listening = true;
          micBtn.classList.add("listening");
          micBtn.textContent = "● 聆聽中";
        };
        recognition.onresult = function (ev) {
          var txt = "";
          for (var i = 0; i < ev.results.length; i++) txt += ev.results[i][0].transcript;
          var last = ev.results[ev.results.length - 1];
          document.getElementById("input").value = txt;
          if (last.isFinal && txt.trim()) { send(txt.trim()); }
        };
        recognition.onerror = function (ev) {
          listening = false;
          micBtn.classList.remove("listening");
          micBtn.textContent = "🎤";
          var msg = ev.error === "not-allowed"
            ? "需要麥克風權限才能語音輸入，請到瀏覽器設定開啟"
            : "語音辨識錯誤：" + (ev.error || "unknown");
          console.warn("[STT]", msg);
          alert(msg);
        };
        recognition.onend = function () {
          listening = false;
          micBtn.classList.remove("listening");
          micBtn.textContent = "🎤";
        };
        try { recognition.start(); } catch (e) { console.warn("[STT] start failed:", e); }
      });
    }

    // ════════════════════════════════════════════
    // TTS 重播（沿用 Phase 5+ / M6.2-1 per-message correlation）
    // ════════════════════════════════════════════
    async function primeTtsCacheForAgent(agentId) {
      try {
        var res = await fetch("/api/tts/recent?agent_id=" + encodeURIComponent(agentId) + "&limit=1", { cache: "no-store" });
        if (!res.ok) return;
        var data = await res.json();
        if (data && data.audios && data.audios.length > 0) {
          lastAudioByAgent[agentId] = data.audios[0].audio_url;
          attachReplayButtonToLatest(agentId);
        }
      } catch (e) { /* 靜默：沒有 audio 不影響主功能 */ }
    }
    function primeTtsCacheForAllAgents() {
      agents.forEach(function (a) { primeTtsCacheForAgent(a.id); });
    }
    function attachReplayButtonToMessage(messageId, agentId) {
      if (!messageId) {
        if (agentId) attachReplayButtonToLatest(agentId);
        return;
      }
      var msg = document.querySelector('.message-agent[data-message-id="' + messageId + '"]');
      if (!msg) {
        if (agentId) attachReplayButtonToLatest(agentId);
        return;
      }
      var old = msg.querySelector(".replay-btn");
      if (old) old.remove();
      if (agentId) {
        var others = document.querySelectorAll('.message-agent[data-agent="' + agentId + '"]:not([data-message-id="' + messageId + '"])');
        others.forEach(function (m) {
          var b = m.querySelector(".replay-btn");
          if (b) b.remove();
        });
      }
      var time = msg.querySelector(".message-time");
      if (!time) return;
      var btn = document.createElement("span");
      btn.className = "replay-btn";
      btn.title = "重播這則訊息 (" + messageId.slice(0, 8) + ")";
      btn.textContent = "🔊 重播";
      btn.onclick = function (e) { e.stopPropagation(); replayMessageAudio(messageId, btn); };
      time.parentNode.insertBefore(btn, time.nextSibling);
    }
    function replayMessageAudio(messageId, btn) {
      var url = lastAudioByMessageId[messageId];
      if (!url) {
        if (btn) {
          btn.textContent = "🔇 沒音檔";
          setTimeout(function () { if (btn.parentNode) btn.textContent = "🔊 重播"; }, 2000);
        }
        return;
      }
      var audio = new Audio(url);
      audio.volume = 0.85;
      audio.play().catch(function () {});
    }
    function attachReplayButtonToLatest(agentId) {
      var all = document.querySelectorAll('.message-agent[data-agent="' + agentId + '"]');
      if (all.length === 0) return;
      all.forEach(function (m) {
        var old = m.querySelector(".replay-btn");
        if (old) old.remove();
      });
      var last = all[all.length - 1];
      var time = last.querySelector(".message-time");
      if (!time) return;
      var btn = document.createElement("span");
      btn.className = "replay-btn";
      btn.title = "重播最近的語音";
      btn.textContent = "🔊 重播";
      btn.onclick = function (e) { e.stopPropagation(); replayLastAudio(agentId, btn); };
      time.parentNode.insertBefore(btn, time.nextSibling);
    }
    function replayLastAudio(agentId, btn) {
      var url = lastAudioByAgent[agentId];
      if (!url) {
        if (btn) {
          btn.textContent = "🔇 沒音檔";
          setTimeout(function () { if (btn.parentNode) btn.textContent = "🔊 重播"; }, 1500);
        }
        return;
      }
      if (currentPlayingAudio) {
        try { currentPlayingAudio.pause(); } catch (e) {}
        currentPlayingAudio = null;
        document.querySelectorAll(".replay-btn.playing").forEach(function (b) {
          b.classList.remove("playing");
          b.textContent = "🔊 重播";
        });
      }
      var audio = new Audio(url);
      audio.volume = 0.85;
      if (btn) { btn.classList.add("playing"); btn.textContent = "▶ 播放中"; }
      audio.play().then(function () {
        currentPlayingAudio = audio;
        audio.onended = function () {
          if (btn) { btn.classList.remove("playing"); btn.textContent = "🔊 重播"; }
          if (currentPlayingAudio === audio) currentPlayingAudio = null;
        };
        audio.onerror = function () {
          if (btn) { btn.classList.remove("playing"); btn.textContent = "🔇 失敗"; }
          currentPlayingAudio = null;
        };
      }).catch(function () {
        if (btn) { btn.classList.remove("playing"); btn.textContent = "🔊 重播"; }
      });
    }

    // ════════════════════════════════════════════
    // WebSocket
    // ════════════════════════════════════════════
    function initWS() {
      var wsUrl = "ws://" + window.location.host + "/ws";
      ws = new WebSocket(wsUrl);
      ws.onopen = function () {
        document.getElementById("status").textContent = "已連線";
        document.getElementById("status").style.color = "#7edc92";
      };
      ws.onclose = function (e) {
        console.warn("[WS] Closed", e);
        document.getElementById("status").textContent = "連線中斷";
        document.getElementById("status").style.color = "#ff7b7b";
      };
      ws.onerror = function () {
        document.getElementById("status").textContent = "連線錯誤";
        document.getElementById("status").style.color = "#ff7b7b";
      };
      ws.onmessage = function (event) {
        try {
          var d = JSON.parse(event.data);
          if (d.type === "agent_speak" && d.text) {
            // 靈魂牆上不收訊息（進入對話才渲染），避免隱形 DOM 累積
            if (!inChatView) return;
            var speaker = d.agent_id || "agent_yua";
            if (currentConversation === "group") {
              if (groupMembers.size > 0 && !groupMembers.has(speaker)) return;
            } else {
              if (speaker !== currentConversation) return;
            }
            appendMessage({
              speaker: speaker,
              content: d.text,
              timestamp: Math.floor(Date.now() / 1000),
              message_id: d.message_id || null
            });
          }
          if (d.type === "agent_audio_ready" && d.audio_url) {
            var agentId = d.agent_id;
            var messageId = d.message_id;
            if (messageId) {
              lastAudioByMessageId[messageId] = d.audio_url;
              if (agentId) lastAudioByAgent[agentId] = d.audio_url;
              if (inChatView) attachReplayButtonToMessage(messageId, agentId);
            } else {
              if (agentId) {
                lastAudioByAgent[agentId] = d.audio_url;
                if (inChatView) attachReplayButtonToLatest(agentId);
              }
            }
            var audio = new Audio(d.audio_url);
            audio.volume = 0.85;
            audio.play().catch(function () {
              // autoplay 失敗很正常（瀏覽器政策），靜默
            });
          }
        } catch (err) {
          console.error("WS message error:", err);
        }
      };
    }

    // ════════════════════════════════════════════
    // 啟動
    // ════════════════════════════════════════════
    window.addEventListener("DOMContentLoaded", function () {
      initAgents();      // /agents → 真名 map + 成員列 + TTS 快取
      loadSoulStatus();  // /api/soul/status → 靈魂牆
      initMic();
      initWS();
    });
  </script>
</body>
</html>
