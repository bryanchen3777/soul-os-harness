llm:
  # 主要 LLM provider（"minimax" | "ollama" | "claude" | "openai" | "mock"）
  # Provider 切換 minimax → ollama (Bry 拍板 2026-08-15): 走 Ollama Cloud OpenAI-compat endpoint
  # model 保持 minimax-m2.7 (Ollama Cloud 有同名 model); OLLAMA_API_KEY 由 .env 注入
  # 其他可選：minimax（直連 MiniMax）、claude（直連 Anthropic）、openai、mock（不接真實 API）
  provider: ollama

  # 統一 model 欄位（env LLM_MODEL 會覆蓋 —— 改這裡不夠，.env 也要同步）
  # Ollama Cloud model 名大小寫敏感：必須用 deepseek-v4.1-flash (小寫)
  # 2026-08-17 Bry 拍板: minimax-m2.7 → deepseek-v4-flash:0731
  #   動機: 時間感知測試 (3 場景 x 4 寫法) 證實 v4 flash 推理能力更強 (沉默時長能轉成情緒, m2.7 做不到)
  # 2026-09-12 切換至 deepseek-v4.1-flash (MODEL-V41-FLASH-1)
  # 2026-10-17 Bry 拍板 (MODEL-V41-FLASH-1017-1): → deepseek-v4.1-flash:1017
  #   鎖定 10/17 這個日期版，不再隨最新 tag 漂移。
  #   🔴 切換前已做「鑑別式探測」確認 ID 真的存在，不是端點吞掉未知後綴造成的假 200：
  #     deepseek-v4.1-flash:1017        → 200 OK
  #     deepseek-v4.1-flash:9999        → 404 model not found（對照組：假 tag）
  #     totally-not-a-model:1017        → 404 model not found（對照組：假模型）
  #   對照組 404 證明端點真的在比對 model 名，故 200 可信。
  #   ⚠️ 帶引號是刻意的：plain scalar 內含 `:` 有解析風險，引號讓意圖無歧義。
  model: "deepseek-v4.1-flash:1017"

  # provider 對應的備援 model（未指定 LLM_MODEL 時 fallback 用）
  openai_model: gpt-4o-mini
  claude_model: claude-haiku-4-5-20251001
  minimax_model: minimax-M2.7

  # MiniMax 細節（llm.minimax.*）
  # MiniMax 提供 OpenAI-compatible endpoint：
  #   https://api.minimax.io/v1/chat/completions
  # Phase 2.4+ 走 OpenAIBackend (跟 openai provider 共用 class)
  minimax:
    # 留空時必須由 env MINIMAX_API_KEY 注入
    api_key: ""

  # OpenAI 細節（llm.openai.*）
  openai:
    api_key: ""
    base_url: https://api.openai.com/v1

  # Claude 細節（llm.claude.*）
  claude:
    # 留空時必須由 env ANTHROPIC_API_KEY 注入
    api_key: ""

  # 生成參數
  # 2026-07-25 Bry 拍板 (Perplexity 給 silent failure 治根方案): M2.x thinking 永遠開,
  # 512 → 4000 給 thinking + JSON output 真正夠用的空間
  # max_tokens key 名 loader 內部會轉成 max_completion_tokens (MiniMax 全系列 deprecate max_tokens)
  # 2026-07-26 Bry 拍板 D-core 修訂: temperature 0.85→0.5 (tool_choice 強制呼叫路徑, 越低越穩,
  # 社群驗證)。7/26 11:08 第一次改 LLMProxy.__init__ default 沒生效 (loader 從 config
  # 餵 keyword arg 0.85 覆蓋 default), 7/26 12:05 v29 silent 撞見才發現, 12:18 修這層
  # Lesson 32 升級條款: 改 default 前要 grep 所有 caller 確認沒被明確傳入覆蓋
  max_tokens: 4000
  # ⚠️ 2026-10-16 OBS-CHRONO-1 考古更正：本欄位對「角色訊息生成」已**不可達**。
  #    工具強制路徑（tool_choice）於 2026-08-05 隨 Lesson 32 一併移除，
  #    角色生成無條件走 `roleplay_temperature`（proxy.py:4263），全檔亦無任何
  #    依 temperature 分流的 if。`self.temperature` 賦值後從未被讀取（死屬性）。
  #    保留此行僅為相容舊設定載入；**新調校請改 roleplay_temperature**。
  temperature: 0.5
  # 2026-10-15 Bryan 批准「去錨定三修法」之溫度: 角色扮演輸出（無 tool call, 走
  # LLMProxy._complete_with_retry）用 roleplay_temperature 0.85——回到 D-core 修訂前
  # 的長期值。修「雷姆在這裡。」錨定：低溫是小模型複讀高頻例句的主因之一。
  # 事件生成走另一條路徑（event_temperature 0.7, generate_event_text）。
  # 每次呼叫實際帶了哪個值，可用 SOULOS_PROMPT_TRACE=1 觀測（見 src/observability/prompt_trace.py）。
  roleplay_temperature: 0.85
  max_retries: 3

  # Bry 拍板 2026-08-03 18:21: 時區設定
  # 動機: 12 小時錯位 (M0.4 跟 f9105f1 預設 Asia/Taipei UTC+8, 但 Bry 人在紐約 EDT/EST)
  # 統一從 src.timezone_utils.get_local_tz 拿 (優先序: env SOULOS_TIMEZONE > 這個 > default)
  # 之前 M0.4 跟 f9105f1 假設 "Windows 沒 zoneinfo" 錯了, 改用 zoneinfo 自動處理 EDT/EST 切換
  # Bry 移地改這個就好, 不用改 code
  timezone: America/New_York

  # 對話歷史保留最近幾輪（每輪 = user + assistant）
  max_history_turns: 10

bus:
  # PriorityQueue 上限
  max_queue_size: 1000

logging:
  level: INFO
  format: "%(asctime)s [%(name)s] %(levelname)s: %(message)s"

# ── Phase 4 RAG（跨 session 對話歷史搜尋）──
# 透過 SQLite FTS5 trigram 索引，從所有 session 撈相關片段
# 注入 LLMProxy 的 memory_context（接在 SAGE graph summary 後面）
rag:
  enabled: true
  top_k: 3                      # 最多注入幾條過去相關記憶
  exclude_current_session: true # 排除當下對話（避免跟 history 重複）

# ── CRASH-F1: server 啟動選項 ──
# 2026-09-12 幕僚長部署翻牌：selector 實驗正式上線（Owner 拍板執行）。
# 動機：主服務 2026-09-12 崩 4 次（00:03 / 08:33 / 08:53 / 09:38），
#       WER 證據 = 錯誤模組 python311.dll + 例外狀況代碼 c0000005（access violation）。
# 假說：ProactorEventLoop（Windows IOCP）路徑觸發 CPython 原生層崩潰。
# 觀察窗口：48h，成功判準 = python311.dll 0xc0000005 崩潰數嚴格為 0。
# 回滾：把 event_loop 改回 proactor + 重啟主服務即可（單行設定，零程式碼變更）。
# 註：環境變數 SOUL_OS_EVENT_LOOP 優先序高於本檔（bogus 值會安全退回 proactor）。
#
# 🔴 2026-09-12 17:03 — 【假說否證，已回滾】（Owner 裁定，幕僚長執行）
#   翻牌後程序在 selector 下連續運行（12:38:06 橫幅 WindowsSelectorEventLoop），
#   仍於 17:03:01 崩潰，簽名完全相同：python311.dll + c0000005 + 位移 0x26659b
#   （WER: data/crash_dumps/20260912_170301_AppCrash_python.exe_*/Report.wer）。
#   存活 4h25m（自 selector 生效）／6h05m（自窗口起算）→ 48h「0 崩潰」判準失敗。
#   結論：Windows IOCP / _overlapped 已排除為根因（兩種 event loop 皆同簽名崩潰）。
#   回滾理由：selector 未換得任何穩定性，卻留下「不支援 asyncio.subprocess」的
#   能力缺口與較差的輪詢效率 → 無理由保留。後續交由 CRASH-AUDIT-2（READ-ONLY）
#   以「跨 loop 共通的 native C-extension / 跨執行緒記憶體踩踏」為新假說續查。
server:
  event_loop: proactor
