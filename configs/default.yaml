# Soul OS — default configuration
# 由 configs/loader.py 載入；.env 環境變數可覆蓋對應欄位

# ── Agents（動態載入，不需要改程式碼）──
# 新增角色：1. 在這裡加一條  2. 在 src/agent/registry.py 的 AGENT_CLASS_MAP 加一行
agents:
  - id: agent_yua
    class: AgentYua
    intimacy_level: 80
    enabled: true
  - id: agent_ruka
    class: AgentRuka
    intimacy_level: 60
    enabled: true
  - id: agent_akane
    class: AgentAkane
    intimacy_level: 50
    enabled: true
  # Phase 6.5 — Rem (Re:Zero)：第 4 個 agent，靈魂鏡像 hermes profiles/rem/SOUL.md
  # 親密度 45 起步（Subaru-Rem 設定：剛被救贖、罪惡感還在），比 Akane 低
  - id: agent_rem
    class: AgentRem
    intimacy_level: 45
    enabled: true
  # Phase 7 — Ram (Re:Zero · COS v1.0)：第 5 個 agent
  # 親密度 40 起步（Subaru-Ram 設定：鬼族驕傲、對話稀疏、intimacy 反映信任累積）
  # 略低於 Rem（沉默頻率最高）。SAGE 寫入走 no-diary 白名單（見 provider.py）
  - id: agent_ram
    class: AgentRam
    intimacy_level: 40
    enabled: true
  # Phase 8 — 椎名真昼 (Re:Zero · COS v1.0)：第 6 個 agent
  # 親密度 45 起步（建立期 21-50,暗流開始滲透,符合 Evolution State 描述）
  # 重要：Mahiru 有 feelings/diary.md，跟 Ram 的 no-diary 設計相反
  # **不套用 NO_DIARY_AGENTS 白名單**（見 provider.py）
  # Sweet Landing / Desire Undercurrent / Anti-Overfitting 由 AgentMahiru 類處理
  - id: agent_mahiru
    class: AgentMahiru
    intimacy_level: 45
    enabled: true
  # Phase 9 — 山田杏奈 (Bokuyaba · Soul OS v1)：第 7 個 agent
  # 親密度 55 起步（建立期 → 中期過渡,敢靠近、會用食物打開距離、會否認）
  # 載入 personas/agent_anna.md（任務書提供,Soul OS distilled 2026-07-01）
  # 重要：Anna 有 feelings/diary.md，跟 Ram 的 no-diary 設計相反
  # **不可劇透原作**：SOUL 規則禁止「在第幾話」「動畫的哪個場景」
  # 5 種 Sentence Pulse + Denial=Approach + Appetite Logic 在 AgentAnna 類處理
  - id: agent_anna
    class: AgentAnna
    intimacy_level: 55
    enabled: true
  # Phase 10 — 桜島麻衣 (Bunny Girl Senpai · Soul OS v1)：第 8 個 agent
  # 國民級女演員 + 病弱症候康復者 + Dry Banter + 直球告白
  # 親密度 60 起步（等級 3 接受期：已經允許私下講「消失」「症候」這些過去）
  # 重要：mai 有 feelings/diary.md，不套用 NO_DIARY_AGENTS
  # 載入 personas/agent_mai.md（任務書 2026-07-01 distilled）
  # **不可時間旅行**：Mai 不是 time-traveler，夢中少女 arc 不允許穿越 / 預知 / 改寫事故
  - id: agent_mai
    class: AgentMai
    intimacy_level: 60
    enabled: true
  # Phase 11 — 中野三玖 (Quintessential Quintuplets · Soul OS v1)：第 9 個 agent
  # 沉默的第一個愛上 Bryan 的人 + 觀察模仿者 + 被認出的渴望
  # 親密度 60 起步（等級 3 接受期：可能觸發 Silent Care / Sudden Sincerity；模仿低頻精準）
  # 重要：miku 有 feelings/diary.md，不套用 NO_DIARY_AGENTS
  # 載入 personas/agent_miku.md（任務書 2026-07-01 distilled,源自 hermes/profiles/miku/SOUL.md v3.6.1）
  # **不可整段長時間 impersonate 姊妹**：Imitation Layer 是文字規則不超過 1-3 句
  # **不可寫成二乃 / 一花 / 五月 / Anna / Mahiru**
  - id: agent_miku
    class: AgentMiku
    intimacy_level: 60
    enabled: true
  # Phase 12 — 日南葵 (Bottom-Tier Character Tomozaki · Soul OS v1)：第 10 個 agent
  # 雙重面具（Layer 0 完美女主角 + Layer 1 人生攻略教官）+ Framework Stress / NO NAME Leakage
  # 親密度 46 起步（等級 2 建立期：Optimal Processing 對 Bryan 啟動;Framework Stress 偶爾觸發）
  # 重要：aoi 有 feelings/diary.md，不套用 NO_DIARY_AGENTS
  # 載入 personas/agent_aoi.md（任務書 2026-07-02 distilled,源自 hermes/profiles/aoi/SOUL.md v2.1）
  # **兩個 Layer 都不可被標記為「真實的她」**：Layer 0 / Layer 1 / Layer ??? 三者都可能是面具
  # **破綻是卡住不是崩裂**：True Crack 不爆發,話說到一半說不下去
  # **不可寫成冰山女王 / 傲嬌 / 純軍師 / 心理諮商師 / 「其實內心很柔軟,只是嘴硬」**
  - id: agent_aoi
    class: AgentAoi
    intimacy_level: 46
    enabled: true

heartbeat:
  # HeartbeatEngine 每隔幾秒發一次 SYSTEM_TICK
  # 設太短會在 CI / 開發機壓力大；建議 60s 為生產預設，1-5s 為本地開發
  tick_interval_seconds: 60

llm:
  # 主要 LLM provider（"minimax" | "claude" | "openai" | "mock"）
  # Phase 2.4+ 預設：minimax（OpenAI-compatible endpoint）
  # JP rollback (Bry 拍板 2026-07-22 20:59): 改回 minimax OpenAI endpoint + M2.7
  # 之前 7/21 換 M3 anthropic 是為了 disable thinking, 整套 JP 砍掉後不需要
  # 其他可選：claude（直連 Anthropic）、openai、mock（不接真實 API）
  provider: minimax

  # 統一 model 欄位（env LLM_MODEL 會覆蓋）
  # JP rollback 後預設 minimax-M2.7 (7/14-7/15 跑得很穩的版本)
  # .env 通常會設 LLM_MODEL=minimax-M2.7
  model: minimax-M2.7

  # provider 對應的備援 model（未指定 LLM_MODEL 時 fallback 用）
  openai_model: gpt-4o-mini
  claude_model: claude-haiku-4-5-20251001
  minimax_model: minimax-M2.7

  # MiniMax 細節（llm.minimax.*）
  # MiniMax 提供 OpenAI-compatible endpoint：
  #   https://api.minimax.io/v1/chat/completions
  # Phase 2.4+ 走 OpenAIBackend (跟 openai provider 共用 class)
  minimax:
    # 留空時必須由 env MINIMAX_API_KEY 注入
    api_key: ""

  # OpenAI 細節（llm.openai.*）
  openai:
    api_key: ""
    base_url: https://api.openai.com/v1

  # Claude 細節（llm.claude.*）
  claude:
    # 留空時必須由 env ANTHROPIC_API_KEY 注入
    api_key: ""

  # 生成參數
  # 2026-07-25 Bry 拍板 (Perplexity 給 silent failure 治根方案): M2.x thinking 永遠開,
  # 512 → 4000 給 thinking + JSON output 真正夠用的空間
  # max_tokens key 名 loader 內部會轉成 max_completion_tokens (MiniMax 全系列 deprecate max_tokens)
  # 2026-07-26 Bry 拍板 D-core 修訂: temperature 0.85→0.5 (tool_choice 強制呼叫路徑, 越低越穩,
  # 社群驗證). 7/26 11:08 第一次改 L1603 LLMProxy.__init__ default 沒生效 (loader 從 config
  # 餵 keyword arg 0.85 覆蓋 default), 7/26 12:05 v29 silent 撞見才發現, 12:18 修這層
  # Lesson 32 升級條款: 改 default 前要 grep 所有 caller 確認沒被明確傳入覆蓋
  max_tokens: 4000
  temperature: 0.5
  max_retries: 3

  # Bry 拍板 2026-08-03 18:21: 時區設定
  # 動機: 12 小時錯位 (M0.4 跟 f9105f1 預設 Asia/Taipei UTC+8, 但 Bry 人在紐約 EDT/EST)
  # 統一從 src.timezone_utils.get_local_tz 拿 (優先序: env SOULOS_TIMEZONE > 這個 > default)
  # 之前 M0.4 跟 f9105f1 假設 "Windows 沒 zoneinfo" 錯了, 改用 zoneinfo 自動處理 EDT/EST 切換
  # Bry 移地改這個就好, 不用改 code
  timezone: America/New_York

  # 對話歷史保留最近幾輪（每輪 = user + assistant）
  max_history_turns: 10

bus:
  # PriorityQueue 上限
  max_queue_size: 1000

logging:
  level: INFO
  format: "%(asctime)s [%(name)s] %(levelname)s: %(message)s"

# ── Phase 4 RAG（跨 session 對話歷史搜尋）──
# 透過 SQLite FTS5 trigram 索引，從所有 session 撈相關片段
# 注入 LLMProxy 的 memory_context（接在 SAGE graph summary 後面）
rag:
  enabled: true
  top_k: 3                      # 最多注入幾條過去相關記憶
  exclude_current_session: true # 排除當下對話（避免跟 history 重複）
