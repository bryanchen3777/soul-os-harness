# Soul OS — default configuration
# 由 configs/loader.py 載入；.env 環境變數可覆蓋對應欄位

# ── Agents（動態載入，不需要改程式碼）──
# 新增角色：1. 在這裡加一條  2. 在 src/agent/registry.py 的 AGENT_CLASS_MAP 加一行
agents:
  - id: agent_yua
    class: AgentYua
    intimacy_level: 80
    enabled: true
  - id: agent_ruka
    class: AgentRuka
    intimacy_level: 60
    enabled: true
  - id: agent_akane
    class: AgentAkane
    intimacy_level: 50
    enabled: true

heartbeat:
  # HeartbeatEngine 每隔幾秒發一次 SYSTEM_TICK
  # 設太短會在 CI / 開發機壓力大；建議 60s 為生產預設，1-5s 為本地開發
  tick_interval_seconds: 60

llm:
  # 主要 LLM provider（"minimax" | "claude" | "openai" | "mock"）
  # Phase 2.4+ 預設：minimax（Anthropic-compatible endpoint）
  # 其他可選：claude（直連 Anthropic）、openai、mock（不接真實 API）
  provider: minimax

  # 統一 model 欄位（env LLM_MODEL 會覆蓋）
  # MiniMax-M2.7-highspeed：204K context、100 tps，對話場景推薦
  # 其他選擇：MiniMax-M3（1M context，推理強）、M2-her（角色扮演）
  model: MiniMax-M2.7-highspeed

  # provider 對應的備援 model（未指定 LLM_MODEL 時 fallback 用）
  openai_model: gpt-4o-mini
  claude_model: claude-haiku-4-5-20251001
  minimax_model: MiniMax-M2.7-highspeed

  # MiniMax 細節（llm.minimax.*）
  # MiniMax 提供 Anthropic-compatible endpoint：
  #   https://api.minimax.io/anthropic/v1/messages
  # Phase 2.4 起直接複用 ClaudeBackend，只換 BASE_URL
  minimax:
    # 留空時必須由 env MINIMAX_API_KEY 注入
    api_key: ""

  # OpenAI 細節（llm.openai.*）
  openai:
    api_key: ""
    base_url: https://api.openai.com/v1

  # Claude 細節（llm.claude.*）
  claude:
    # 留空時必須由 env ANTHROPIC_API_KEY 注入
    api_key: ""

  # 生成參數
  max_tokens: 300
  temperature: 0.85
  max_retries: 3

  # 對話歷史保留最近幾輪（每輪 = user + assistant）
  max_history_turns: 10

bus:
  # PriorityQueue 上限
  max_queue_size: 1000

logging:
  level: INFO
  format: "%(asctime)s [%(name)s] %(levelname)s: %(message)s"
