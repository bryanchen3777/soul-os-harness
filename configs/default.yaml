# Soul OS — default configuration
# 由 configs/loader.py 載入；.env 環境變數可覆蓋對應欄位

# ── Agents（動態載入，不需要改程式碼）──
# 新增角色：1. 在這裡加一條  2. 在 src/agent/registry.py 的 AGENT_CLASS_MAP 加一行
# FG-2 (germ 初始化邊界): agents 條目可選 `initialization_mode` 欄位（seeded | germ）,
#   缺省 = seeded（fail-closed：漏設 / 拼錯 / 類型錯誤一律 seeded, 不會把現有 agent 意外變成 germ）。
#   seeded = 載入 _AGENT_IDENTITY_RULES 等 seeded identity projection（現有 10 隻的行為, 零改動）;
#   germ   = 跳過 seeded identity projection, 只注入 germ anchor 三句 + 名字 handle + 輸出契約。
#   現有 10 條不寫此欄位 = 全部 seeded。
agents:
  - id: agent_yua
    class: AgentYua
    intimacy_level: 80
    enabled: true
  - id: agent_ruka
    class: AgentRuka
    intimacy_level: 60
    enabled: true
  - id: agent_akane
    class: AgentAkane
    intimacy_level: 50
    enabled: true
  # Phase 6.5 — Rem (Re:Zero)：第 4 個 agent，靈魂鏡像 hermes profiles/rem/SOUL.md
  # 親密度 45 起步（Subaru-Rem 設定：剛被救贖、罪惡感還在），比 Akane 低
  - id: agent_rem
    class: AgentRem
    intimacy_level: 45
    enabled: true
    # REM-TEXT-1 (2026-09-11): 文字頻道括號動作守門 — 只對雷姆開啟。
    # 缺省 = False（維持現狀不剝）；Yua 等其餘 agent 一律不得開啟
    # （Yua 故意使用括號行為標籤，見 personas/agent_yua.md:433）。
    text_channel_stage_guard: true
  # Phase 7 — Ram (Re:Zero · COS v1.0)：第 5 個 agent
  # 親密度 40 起步（Subaru-Ram 設定：鬼族驕傲、對話稀疏、intimacy 反映信任累積）
  # 略低於 Rem（沉默頻率最高）。SAGE 寫入走 no-diary 白名單（見 provider.py）
  - id: agent_ram
    class: AgentRam
    intimacy_level: 40
    enabled: true
  # Phase 8 — 椎名真昼 (Re:Zero · COS v1.0)：第 6 個 agent
  # 親密度 45 起步（建立期 21-50,暗流開始滲透,符合 Evolution State 描述）
  # 重要：Mahiru 有 feelings/diary.md，跟 Ram 的 no-diary 設計相反
  # **不套用 NO_DIARY_AGENTS 白名單**（見 provider.py）
  # Sweet Landing / Desire Undercurrent / Anti-Overfitting 由 AgentMahiru 類處理
  - id: agent_mahiru
    class: AgentMahiru
    intimacy_level: 45
    enabled: true
  # Phase 9 — 山田杏奈 (Bokuyaba · Soul OS v1)：第 7 個 agent
