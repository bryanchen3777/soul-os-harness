# Soul OS — default configuration
# 由 configs/loader.py 載入；.env 環境變數可覆蓋對應欄位

heartbeat:
  # HeartbeatEngine 每隔幾秒發一次 SYSTEM_TICK
  # 設太短會在 CI / 開發機壓力大；建議 60s 為生產預設，1-5s 為本地開發
  tick_interval_seconds: 60

llm:
  # 主要 LLM provider（"openai" | "claude" | "mock"）
  # Phase 1/2.0：開發/測試用 "mock"，不需真實 API
  # Phase 2.2+：切到 "claude" 跑真實煙霧測試
  provider: mock

  # 統一 model 欄位（env LLM_MODEL 會覆蓋）
  model: claude-haiku-4-5-20251001

  # provider 對應的備援 model（未指定 LLM_MODEL 時 fallback 用）
  openai_model: gpt-4o-mini
  claude_model: claude-haiku-4-5-20251001

  # OpenAI 細節（llm.openai.*）
  openai:
    base_url: https://api.openai.com/v1

  # Claude 細節（llm.claude.*）
  claude:
    # 留空時必須由 env ANTHROPIC_API_KEY 注入
    api_key: ""

  # 生成參數
  max_tokens: 300
  temperature: 0.85
  max_retries: 3

  # 對話歷史保留最近幾輪（每輪 = user + assistant）
  max_history_turns: 10

bus:
  # PriorityQueue 上限
  max_queue_size: 1000

logging:
  level: INFO
  format: "%(asctime)s [%(name)s] %(levelname)s: %(message)s"
