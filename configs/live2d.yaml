# Soul OS — Live2D widget 設定（Phase 6.4）
# 三個 agent 對應不同的 Live2D model + TTS voice
# 換 voice / model 只要改這檔，後端跟前端會自動套用

live2d:
  default_agent: yua

  # 每個 agent 配哪個 model 跟 voice（短代號，去 models/voices 對應表查實際 URL）
  agents:
    yua:
      model: hibiki  # 官方 Cubism 5 SDK sample（5 motions + 6 expressions）
      voice: zh-CN-XiaoxiaoNeural
      greeting: "你好～我是 Yua，冷泡茶式的陪伴。今天想聊點什麼？"
    ruka:
      model: haru   # 2026-06-12: 換成 Ruka 專屬的 haru（從 Downloads 解壓）
      voice: zh-CN-XiaoxiaoNeural
      greeting: "嗨！我是 Ruka，有什麼想說的嗎？"
    akane:
      model: epsilon  # 2026-06-12: 換成 Akane 專屬的 Epsilon（從 Downloads 解壓）
      voice: zh-CN-XiaoxiaoNeural
      greeting: "……茜在。說吧。"

  # Live2D model URL 對應表
  # - hibiki / haru / epsilon: 本地解壓的官方 sample（從 Downloads 解到 static/models/）
  # - mao / rice: CDN 上的官方 sample（佔位用，之後可換正式授權角色）
  models:
    haru:    "/static/models/haru/haru/runtime/haru.model3.json"
    mao:     "https://cdn.jsdelivr.net/gh/Live2D/CubismWebSamples/Samples/Resources/Mao/Mao.model3.json"
    rice:    "https://cdn.jsdelivr.net/gh/Live2D/CubismWebARSample/assets/models/Rice/Rice.model3.json"
    hibiki:  "/static/models/hibiki/hibiki/runtime/hibiki.model3.json"
    epsilon: "/static/models/epsilon/Epsilon/runtime/Epsilon.model3.json"
